author: DuLL-FoX
delete-after: true
changes:
  - bugfix: 'Устройство самоактуализации больше не подсовывает телу удалённые травмы:
      они переживают смену внешности целиком, а не превращаются в вечный источник
      ошибок.'
  - bugfix: Снятие квирков "Фобия" и "Немота" наконец действительно лечит саму травму.
  - bugfix: Ячейки объёмного рюкзака перестали удерживать предметы, которые в них
      когда-то показывались.
  - bugfix: Кровь, брызнувшая на полнотайловое окно с безопорного тайла, больше не
      оставляет на нём невидимый мусор.
  - bugfix: Помеченная свежим тэггером посылка больше не вызывает ошибку.
  - bugfix: Легион, разобранный вместе с телом внутри, больше не таскает удалённую
      жертву.
  - bugfix: Хад дрона без игрока больше не сыплет ошибками.
  - bugfix: Раскладка клавиш с испорченной записью в сейве больше не ломает применение
      набора.
  - bugfix: Аркадный автомат Orion Trail перестал помнить всех, кто когда-либо в него
      играл.
  - bugfix: Призраки, вторые личности и конфетти партийной гранаты больше не копятся
      в памяти сервера до конца раунда.
  - bugfix: Модкит, поставленный на ствол без магазина, больше не оставляет оружию
      ссылку на удалённый магазин.
  - bugfix: Разобранная консоль больше не утаскивает свою плату вместе с собой.
  - bugfix: Диско-джукбокс перестал накапливать зависшие циклы подсветки - по одному
      на каждую смену трека.
  - bugfix: Голодек больше не помнит питомцев, которых сам же и убрал.
  - bugfix: Вещи, снятые вместе с ушедшим в криосон, больше не держат его тело до
      конца смены.
  - bugfix: Раздача должностей на старте раунда больше не пропускает каждого второго
      игрока в проходе по приоритету.
  - code_imp: Закрыты источники hard delete из прод-логов раундов 9813, 9823, 9824,
      9827, 9829 и 9830; на каждый добавлены юнит-тесты.
  - server: Удаление тела больше не оставляет в памяти сервера ни само тело, ни его
      квирки и незакрытые операции - это была треть всех утечек смены и самая дорогая
      из них
  - bugfix: Разбор машины больше не может потерять её плату
  - bugfix: Восстание вендоматов больше не удерживает автоматы, уничтоженные по ходу
      события
  - bugfix: Призрак, наблюдавший за кем-то, больше не остаётся привязан к цели после
      смены вида
  - bugfix: Разобранная меха больше не держит свою канистру, а посадка в двухместную
      больше не проходит дважды
  - bugfix: Нормализатор размера, портальные трусики, застрявшие осколки и консоль
      поезда отеля больше не копятся в памяти до конца смены
  - bugfix: Череп легиона больше не делит списки с породившим его боссом
  - bugfix: Предмет, удалённый из рук на глазах наблюдающего призрака, больше не держится
      в памяти сервера до конца смены
  - bugfix: Эскейп-меню больше не оставляет свои кнопки в памяти после закрытия и
      корректно разбирается, когда игрок выходит
  - bugfix: Очистка экрана клиента больше не пропускает каждый второй объект
  - bugfix: Ствол больше не держит ссылку на удалённый магазин - следующий выстрел
      не роняет ошибку
  - bugfix: Руна призыва больше не оставляет эффект в нуль-спейсе
  - bugfix: Раны больше не остаются на конечности после удаления - это давало тысячи
      ошибок за смену и ломало сканеры, осмотр и подсчёт крови
  - bugfix: Пришитая обратно конечность сохраняет свои раны, а не теряет их
