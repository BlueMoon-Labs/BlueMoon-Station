author: DuLL-FoX
delete-after: true
changes:
  - rscadd: 'Экономика переделана: отделы живут на бюджет с грантом NT на оклады,
      зарабатывают работой и контрактами NT, закупаются из своего каталога по заявкам;
      консоль наград стала доской контрактов.'
  - rscadd: 'Контракты: личные заказы NT, объявления экипажа с наградой, серии этапов,
      падающая цена повторов, отказ от взятого контракта.'
  - rscadd: 'Новая консоль снабжения: рынок с живыми ценами, торговые партнёры с эксклюзивными
      паками, спецзаказы, скупка пачками, аукцион сектора и аукцион экипажа.'
  - rscadd: Биржа с дивидендами, индексом сектора и заявками, акции двигает работа
      станции; табло котировок и "Сводка сектора"; состояние сектора переходит в следующий
      раунд.
  - rscadd: Кошелёк в КПК, личные заказы и подарки с КПК, касса на двух кассиров с
      наличными, аренда прилавков, казна станции, финансовый аудит, админ-панель "Экономика".
  - rscadd: Предателям - скиммер, анонимный счёт, инсайдерский пейджер, пресс-релиз
      и экономические цели; СБ - таможня и хранилище улик.
  - rscadd: 'Экономические события директора: обвал рынка, выкуп пиратам, эмбарго,
      грант NT, гуманитарная поставка, бум спроса, дефицит, лотерея.'
  - balance: Зарплата из бюджета отдела по грейду с налогом, подъёмные 3 зарплаты
      вместо 5; NT выкупает купленное не дороже половины базы и не покупает ТК; игровые
      автоматы честные, с общим джекпотом сектора; доход криптомайнеров ограничен.
  - bugfix: CRAB-17 не срабатывает из VR и с полигона; вербы игроков не отваливаются
      при росте числа процов.
  - sound: Звуки кассы, узла экспорта, хранилища улик, скиммера, биржи и зарплаты.
  - image: Спрайты кассы, узла экспорта, консолей отделов, биржи, хранилища улик и
      предметов.
  - map: Машины экономики на всех станционных картах.
  - config: Числа баланса экономики в config/economy.json, перечитываются из админ-панели
      без рестарта.
