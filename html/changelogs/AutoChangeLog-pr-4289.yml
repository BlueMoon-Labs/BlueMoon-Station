author: Herobrine998
delete-after: true
changes:
  - rscadd: Зачатки вкладки редактора расовых особенностей. Особенности могут быть
      основными или дополнительными. Основная может быть только 1, дополнительных
      сколько угодно. У каждой особенности может быть свой набор условий для взятия.
  - rscadd: Первая добавленная особенность «Опорный хвост». Необходимо тело Naga.
      Особенность заменяет 2 ноги у куклы на отдельный хвост, Блокирует слот ботинок
      и выдает трейт твердых ступней, При пересадке не дает носителю ходить, если
      у него ноги, а не хвост, Хвост имеет статы 2ух ног с небольшим бафом, С хвостом
      недоступны часть действий ногами и на него не работает часть механов, например
      связывание ног и болы, Перелом хвоста не отнимает способность ползать, но накладывает
      большой штраф к скорости, При отрубании хвоста, спрайт тела заменяется на особый
      отрезанный спрайт. Пересадка хвоста осуществляется через операцию на groin куклы,
      Особенности, включая хвост видно на мед. сканере и описаны подсказки для медиков
