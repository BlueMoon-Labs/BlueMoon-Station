author: Silver-Paws
delete-after: true
changes:
  - rscadd: Добавлен список аксессуаров для униформы иконками, видимый при осмотре
      униформы. ЛКМ по иконке осмотрит аксессуар, ПКМ снимет его.
  - rscdel: Alt-клик по униформе больше не снимает аксессуары.
  - spellcheck: Уточнены и доработаны текста аксессуаров и униформы. Проведён перевод
      интерактов.
  - code_imp: Добавлен обработчик клика правой кнопкой мыши для браузерного чата игры.
