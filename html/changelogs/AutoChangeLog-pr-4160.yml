author: Herobrine998
delete-after: true
changes:
  - rscadd: Портированы воздушные двери и стены с парадиза
  - rscadd: Кейсы с стенками добавлены в инженерный автомат и при заходе на роль
  - rscadd: С ново ТГ портированы airbags, все фаерлоки в окнах заменены на них
  - rscadd: Коробки с airbags добавлены в вендомад инженерам, шкафы атмосферников
      и так-же airbags будут автоматически установлены в стеклах созданных RCD
  - rscadd: Коробки с надувными стенками, в разных вариантах могут быть в синих аварийных
      ящиках
  - balance: Изменена прочность фаерлоков, обычные 300 -> 100, тяжелые 550 -> 250
  - bugfix: Исправлен баг, что двери и шлюзы не сразу открывались при натыкании на
      них
  - bugfix: Исправлен баг, что фаерлоки могли сразу закрыться, даже при ручном открытии
  - rscadd: На Ctrl можно заблокировать автозакрытие фаерлока на 3 минуты, ручное
      открытие ломом, блокирует автозакрытие на 10 секунд.
  - code_imp: Заменен шрифт у контекстных подсказок на Ру языка на более мелки с одинаковой
      пиксельной сеткой
