author: MrPe4henika
delete-after: true
changes:
  - rscadd: 'Добавлена новая возможность для Трейтора ИИ: Фабрика дронов за 50 ПТ.
      Фабрика сама по себе производит 3 разведывательных дрона, а также поддерживает
      их  число. Игроки могут зайти за созданные единицы по клику или же после предложения
      гостам.'
  - rscadd: Добавлены разведывательные дроны, имеют большую скорость, не имеют возможности
      атаковать кого либо, общаются только на дроновом языке, понимают все языки,
      а также имеет полный доступ по станции и возможность общаться с ИИ.
  - rscadd: Добавлена новая способность "Боевой Дрон", позволяет ИИ за 10 ПТ создать
      БОЕВОГО БОТА, имеет лазерное оружие, крайне низкую скорость, достаточно большое
      количество здоровья, не имеет доступа к дверям, также обладает дроновым языком
      и связью с ИИ
