author: DuLL-FoX
delete-after: true
changes:
  - rscadd: 'У личной музыкальной шкатулки появилась библиотека: залитые за раунд
      треки можно снова выбрать без новой загрузки.'
  - qol: 'Личная музыкальная шкатулка: до 10 загрузок за раунд, пауза между загрузками
      1 минута.'
  - server: Загруженные в личную шкатулку треки больше не сохраняются в логах раунда.
  - bugfix: Переносную колонку и шкатулку в руках нормально слышно соседям, а не только
      эхом.
  - bugfix: Джукбоксы больше не замирают из-за одной колонки вне карты.
  - bugfix: Очередь джукбокса бара без доступа не изменить; перемещение трека с дублями
      двигает нужный трек.
  - bugfix: Музыка джукбоксов тише при низком давлении.
  - bugfix: Громкость 0 в шкатулке больше не показывается как 100, неудачная загрузка
      не сбрасывает текущий трек.
  - bugfix: Случайный трек от Bath Salts больше не играет тем, кто выключил звук джукбоксов.
