author: Silver-Paws
delete-after: true
changes:
  - rscdel: Офицеры СБ утратили секхайлер маску при спавне на смене (Дубликат уже
      лежал в коробке выживания).
  - qol: 'Униформа и перчатки игроков больше не должны загрязняться кровью, если эти
      айтемы закрыты соответствующей одеждой: скафандрами, EVA, развёрнутым MOD, e.t.c.'
  - qol: Окровавленные перчатки не должны загрязнять кровью поднятые айтемы, если
      закрыты другой одеждой.
  - bugfix: 'Персонажи с опцией "без имени": номер имени (Он же номер в ID) теперь
      будет синхронизироваться в манифесте и других источниках, а также при клонировании.'
  - bugfix: При клонировании игра теперь корректно передаёт DNA enzyme клону от персонажа.
  - server: Добавлены юнит тесты проверок на клонирование, присвоение номера персонажам
      "Без имени"
