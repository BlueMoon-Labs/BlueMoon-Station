author: MrPe4henika
delete-after: true
changes:
  - rscadd: "Полноценная система жидкостей на тайлах (порт с NovaSector, адаптирована под BlueMoon): реагенты и жидкости на полу текут по соседним тайлам, смешиваются, смещаются и испаряются."
  - rscadd: "Несколько уровней глубины жидкости: лужа, по щиколотку, по пояс, по плечи и полностью с головой. Каждый уровень имеет свою скорость, погружение и визуал."
  - rscadd: "Швабра (mop) теперь впитывает жидкость с пола, а большинство ёмкостей с реагентами (стаканы, канистры и т.п.) могут зачерпнуть жидкость из лужи."
  - rscadd: "Напольные сливы (drain) для борьбы с затоплениями: засасывают жидкость с тайла, завариваются сваркой; добавлен увеличенный вариант (big drain)."
  - rscadd: "Переносной жидкостный насос (portable liquid pump): откачивает или выбрасывает жидкость, требуется закрепление на полу, имеет внутреннюю ёмкость."
  - rscadd: "Подпольные насосы-трубопроводы (floor pump input/output): перекачивают жидкость в plumbing-сеть и обратно, с регулятором уровня высоты и автоматической доливкой бассейнов."
  - rscadd: "При ходьбе по жидкости персонаж замедляется (эффект water_affected), скорость зависит от глубины."
  - rscadd: "Подводное дыхание: без черты персонаж задерживает дыхание, а при нехватке кислорода начинает захлёбываться и заглатывать жидкость; с чертой TRAIT_WATER_BREATHING — спокойно дышит под водой."
  - rscadd: "Температура жидкости влияет на температуру тела: при погружении организм охлаждается/нагревается от жидкости."
  - rscadd: "Горючие жидкости на полу (алкоголь, топливо, термоит, напалм и др.) могут воспламеняться и гореть, пока хватает реагентов и кислорода."
  - rscadd: "При падении в воду производится сплеск, персонаж может поскользнуться, а при падении в воду выше пояса падение смягчается (сбивание с ног вместо урона)."
  - rscadd: "Эмоут \"Вода\" (*water) для черты «Водный аспект» — одним движением руки создаётся лужа чистой воды."
  - rscadd: "Новый родовой квирк «Водный аспект (Эмоуты)» и черта TRAIT_WATER_ASPECT."
  - rscadd: "Персонажи с чертой Messy при оргазме оставляют настоящую растекающуюся лужу на полу, а не статичный деколь."
  - rscadd: "Новые напольные плитки: приподнятый и углублённый пол, а также плитка бассейна (обычная, булыжник, бок, угол)."
  - rscadd: "Жидкости корректно перемещаются вместе с шаттлами и при смене тайлов."
  - bugfix: "Реагент Drying Agent теперь действительно убирает жидкость с тайла, а не только высушивает поверхность."
  - bugfix: "Бассейны интегрированы с системой жидкостей: автоматическое наполнение/уровень, работа слива бассейна через жидкостную систему."
  - soundadd: "Звуки шагов по воде и всплесков при ходьбе/падении в жидкость."
  - qol: "Админ-вербы «Spawn Liquid» и «Remove liquids (радиус)» для создания и удаления жидкостей."
  - admin: "Дебаг-инструменты: подсветка групп жидкостей цветом для отладки (toggle_liquid_debug)."
  - code_imp: "Порт системы жидкостей с NovaSector, адаптация сигналов/сглаживания (SMOOTH_BITMASK) и их интеграция в BlueMoon-сборку."