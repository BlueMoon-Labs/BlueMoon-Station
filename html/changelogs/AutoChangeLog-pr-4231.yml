author: DuLL-FoX
delete-after: true
changes:
  - rscadd: 'ПКМ открывает меню действий у курсора: действия объекта, интенты, вербы,
      подсказки, список вещей на клетке со значками.'
  - rscadd: 'ПКМ и Shift+ПКМ настраиваются отдельно: меню действий, меню BYOND как
      раньше или сразу действие.'
  - rscadd: 'Настройка вида и поведения меню: наборы, форматы, темы, шрифты, размеры,
      значки, анимации, переспрос опасных действий.'
  - rscadd: 'Второе действие ПКМ у предметов: открыть сумку на месте, отделить от
      стака, внутренний воздух, одежда без снятия, фонари, стук в дверь.'
  - qol: Меню рисуется окном с чётким текстом; куча вещей открывается сразу списком,
      Ctrl по строке тянет вещь.
  - qol: Подсказки скринтипа на русском и показывают, на какой кнопке действие.
  - bugfix: Передача на ПКМ больше не стреляет; починены ПКМ у копья, баррикады, дубинки
      и стула.
  - admin: В меню действий подменю со всеми админ-вербами по цели, на каждой странице.
  - config: RIGHT_CLICK_MODE_DEFAULT - режим ПКМ по умолчанию (0 сразу действие, 1
      меню действий, 2 меню BYOND).
