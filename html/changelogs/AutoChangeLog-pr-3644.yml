author: DuLL-FoX
delete-after: true
changes:
  - code_imp: спрайтшиты интерфейсов собирает rust-g (IconForge) вместо DreamMaker,
      инициализация мира больше не ждёт их
  - code_imp: сборка спрайтшитов уехала с инициализации в лобби и переиспользует результат
      прошлого раунда, если иконки не менялись
  - code_imp: спрайтшит, часть иконок которого ещё не доехала на диск (деплой копирует
      дерево во время старта), пересобирается сам вместо дырявого листа на весь раунд
  - code_imp: книга рецептов диспенсера уезжает клиенту JSON-ассетом вместо мегабайтного
      сообщения tgui - таких аллокаций 32-битный DreamDaemon может не пережить
  - server: панель спавна, витрины вендоматов, дизайны исследований, трубы, эмодзи
      и превью декалей больше не строятся иконка-за-иконкой на старте
  - server: деплой кладёт dmb и rsc последними, чтобы сторож не стартовал мир посреди
      копирования иконок
  - bugfix: плитки дизайнов в компактном режиме РнД-консоли выровнены - последняя
      в ряду больше не проседает на 2px, между плитками ровный зазор
