author: DuLL-FoX
delete-after: true
changes:
  - bugfix: Звуки заряда и удара молнии портального шторма выключаются тумблером звуков
      оповещений.
  - bugfix: Изучения в чужой сети РнД больше не объявляются по станционной рации.
  - bugfix: Crab-17 не списывает деньги со счетов гост-ролей и инспекции СОЛ.
  - bugfix: Таймстоп сепии больше не отключает чат.
  - bugfix: Маркинги молей рисуются под обычными маркингами.
  - bugfix: Светящиеся маркинги гасят верхняя одежда, перчатки, пояс, рюкзак, бельё
      и носки.
  - bugfix: Кнопки смены этажа не вытаскивают из шкафа, капсулы или меха.
  - bugfix: Мобы не бьют и не стреляют из шкафов и ящиков, а пытаются выбраться; демона
      крови в кровавом прыжке не видят.
  - tweak: В настройках персонажа видно, что включённые антаг-роли поднимают уровень
      целей заданий.
  - bugfix: Билдмод снова подсвечивает выбранную зону.
  - bugfix: Этажи миникарты в одной рамке и масштабе, подписи зон работают на каждом
      этаже.
  - bugfix: Консоль загрузки законов работает с любого этажа станции.
  - bugfix: На Траме у экспериментора есть РнД-консоль.
  - bugfix: Шаттл Vanguard Igla запитан от своего генератора.
  - bugfix: Досрочный вылет СОЛ за 100 000 штрафа работает, вернувшиеся инспекторы
      получают цель.
  - bugfix: Шлем биокостюма Interdyne на мордатых видах.
  - bugfix: Закрыты эксплойты с дробными и отрицательными числами и чужими ссылками
      в интерфейсах.
  - tweak: Ночное окно без ротации режимов - 01:00-10:00 МСК.
