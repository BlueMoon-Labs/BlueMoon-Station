author: Herobrine998
delete-after: true
changes:
  - qol: Возвращена панель быстрых эмоутов "Звездочка"
  - qol: В звездочку добавлена возможность ручной сортировки эмоций или вернуть автосортировку
      (Кнопка А)
  - qol: В эмоут таб и звездочку добавлена возможность включить синхронизацию эмоций,
      тогда новые будут появляться и там и там
  - rscadd: 'Добавлен преф, что делать с меню тайла на альт клик, возможности: Преключать
      на него всегда (как сейчас), только при клике на сам тайл, никогда автоматически
      не переключать. При этом сама вкладка открывается и можно всегда нажать руками'
  - qol: Если вы открываете хранилище по альт клику, а оно на тайле (коробку например),
      то вкладка не будет переключаться автоматически
  - qol: При закрытии вкладки пола, вас перебросит не на первую вкладку, а на прошлую
      открытую
  - qol: Возвращена возможность по alt клику на сканер, перевести его в режим вывода
      в чат (теперь сохраняется в префах)
