author: DuLL-FoX
delete-after: true
changes:
  - rscadd: 'Еретик: общий каркас путей - захват, дела пути, ресурсы, кодекс и обучение
      работают одинаково для всех 15 путей.'
  - balance: 'Еретик: побег клинком и руна трансмутации работают только на станции.'
  - rscadd: 'Пучина: утягивает на дно в своей воде, Сброс тянет цель к еретику, метка
      в виде якоря, лужи разлива растекаются по клеткам.'
  - rscadd: 'Песок: достаёт бегущих, Засуху видно на теле цели, поле часов бьёт одним
      звуком.'
  - rscadd: 'Пустота: Ледяная темница, рывок Ищущего клинка теперь видно.'
  - balance: 'Стекло: заточено под быстрый бой - луч доворачивает за целью, трещины
      раскалывают по стадиям, плавные переходы между стёклами.'
  - rscadd: 'Пепел: запекает горящих в саван и оставляет тлеющие отпечатки, у Обряда
      дозора свой огонь.'
  - rscadd: 'Космос: начинает охоту сам, у Орбиты есть прицел, у звёздного поля кайма,
      перерисован Звездочёт.'
  - rscadd: 'Клинок: дуэль, просвет в защите отмечается своим знаком, камертон звенит
      сталью.'
  - rscadd: 'Луна: захватывает отражениями, Затмение показано одним диском, глаза
      в помутнении.'
  - rscadd: 'Плоть: слуги держат цель и ходят своим переходом, своя хватка.'
  - rscadd: 'Дух: душа - копия жертвы на одной кнопке, метка-обол и фонарь перевозчика.'
  - rscadd: 'Замок: вскрывает шкафы, консоли, турели, мехов и рюкзаки, крупные хватка
      и освобождение.'
  - rscadd: 'Эхо: слушает интеркомы, уход в эфир и Тишину видно и слышно.'
  - rscadd: 'Ржавчина: приковывает корнями к полу очага и поднимает свои стены, Коррозийный
      вал больше не требует сварки.'
  - qol: 'Пляска: экипаж понимает, что происходит, партнёра можно растолкать, барабан
      показывает сердца сквозь стены.'
  - rscadd: 'Кровь: способности видно и слышно, у метки и связи свои рисунки, сильный
      всплеск при взыскании.'
  - balance: 'Воск: укол куклы бьёт по зонам тела, метка ставится по центру цели.'
  - rscadd: 'Еретик: Дом памяти - стены, провалы, осколки памяти, тени и свой ритм
      у каждого пути, демоны гибнут распадом, у сердца четыре сигнала.'
  - rscadd: 'Еретик: нимбы и небо вознесения у каждого пути, свои темы Эха, Песка,
      Воска и Духа, кульминации путей.'
  - qol: 'Еретик: путь виден по захвату, метки всех путей отображаются поверх тела.'
  - qol: 'Еретик: мантии и вещи видны в руках, мантии новых путей разложены на полу.'
  - imageadd: 'Еретик: у каждой способности свой значок, алерты пути в виде медальонов
      вместо мировых спрайтов.'
  - imageadd: 'Еретик: свои взрывы меток и вспышки у каждого пути, перерисованы боевые
      эффекты и следы.'
  - imageadd: 'Еретик: перерисованы сеты Воска и Пляски, книги, реликвии, медальоны,
      Звездочёт, кукла Воска (с головой и биркой).'
  - soundadd: 'Еретик: свои наборы звуков у всех путей и звуки обряда вознесения.'
