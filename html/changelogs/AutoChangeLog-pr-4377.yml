author: DuLL-FoX
delete-after: true
changes:
  - balance: Снабжение может копить на дорогие паки и отряды ОБР, глава отдела раз
      в 10 минут сбрасывает доску контрактов.
  - bugfix: Детали HK-51 появляются полным комплектом в названных местах.
  - bugfix: Вода в бассейне больше не исчезает от пены и швабры, летящие не падают
      в бассейн.
  - bugfix: Слепота от яда пауков ужаса проходит сама, плевок дрона наносит урон кислотой.
  - bugfix: После таймстопа не остаётся серого экрана без интерфейса.
  - bugfix: ПКМ-меню работает у призраков, панель взаимодействий - у мобов в руках,
      сумке и у pAI.
  - bugfix: Дрейк больше не бьёт меха в полёте, лак для ногтей не пропадает при переодевании.
