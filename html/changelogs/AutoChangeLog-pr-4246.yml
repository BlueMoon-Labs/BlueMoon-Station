author: DuLL-FoX
delete-after: true
changes:
  - map: Убраны двойные пожарные шлюзы и задвоенные трубы мусоропровода на 13 станциях.
  - bugfix: Мусорки в морге Delta Station и в руине Deep Space One на Lavaland подключены
      к мусоропроводу, у аванпоста InteQ закрыта дыра в стене.
  - bugfix: Начало раунда больше не задерживается подготовкой уровней для полётов
      шаттлов, сильнее всего это было на Layenia.
  - bugfix: 'Выбор профессии в меню больше не подвешивает сервер: превью персонажа
      рисуется у игрока.'
  - bugfix: Убраны подлагивания от турелей и от очистки уровней с руинами.
  - code_imp: Худы гостов не держат тысячи пустых значков, сервер тратит меньше времени
      на отправку карты.
  - code_imp: 'CI переделан: одна сборка, тесты параллельно с повтором нестабильных,
      линтер карт и рендер изменённых карт в PR.'
