author: DuLL-FoX
delete-after: true
changes:
  - rscadd: Расходники каталога отдела сотрудник заказывает сам, без одобрения главы,
      в пределах часового лимита.
  - rscadd: ИИ одобряет и отклоняет заявки отделов на консоли бюджета, кроме заявок
      СБ.
  - rscadd: Заявку без решения 20 минут может одобрить начальник снабжения за бюджет
      отдела.
  - qol: В заявках видно, сколько заявка ждёт, кто её решит и что будет дальше; дорогую
      заявку глава ставит целью накопления прямо из списка.
  - qol: 'Терминал контрактов переделан: вкладки доски, своих контрактов, объявлений
      экипажа, спецзаказов и аукциона.'
  - config: Новые настройки экономики staple_self_order_cap_hour и request_handoff_minutes.
