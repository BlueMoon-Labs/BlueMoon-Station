author: Herobrine998
delete-after: true
changes:
  - rscadd: Перенос и доработка избранного эмоций из звездочки, в отдельную вкладку
      stat панели. Автосортировка убрана, теперь эмоции можно ставить так, как захочется
      перетаскиванием. Добавлена возможность создать группы и поместить эмоции в них.
      Каждую кнопку можно отдельно покрасить на ПКМ, как и каждую группу можно покрасить
      в желаемый цвет. В общих настройках вкладка эмоций отделена от других настроек
      и вы можете кастомно настроить общий цвет кнопок, текста, размер шрифта и прочее.
  - rscdel: Звездочка над чатом выключена (мы же не сторонники вырезать старое, поэтому
      временно)
