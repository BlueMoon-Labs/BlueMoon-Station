author: Herobrine998
delete-after: true
changes:
  - rscadd: Добавлена «обратная» позу для belly riding и соответствующую интеракцию.
      Смена позы по кнопке, после надевания harness на пояс. В новой позе и HARM интенте,
      переносимому персонажу будет наноситься 1 окси урона и текст подсвечиваться
      красным, с соответствующими замечаниями
  - bugfix: Исправлены офсеты и масштабирования для belly riding, теперь в пределах
      разницы 100+- персонажи выглядят адекватно
