author: DuLL-FoX
delete-after: true
changes:
  - map: 'новая карта Трамстанция (порт с /tg/), от 70 игроков: два этажа на астероиде,
      трамвай между секциями, лифты, эвакуационный трамвай и грузовой корабль'
  - map: 'новая карта NorthStar (порт с Bubberstation), от 70 игроков: четыре палубы'
  - map: новая карта VoidRaptor (порт с Bubberstation), от 40 игроков
  - map: 'новая карта IceBox (порт с Bubberstation), от 50 игроков: три уровня на
      ледяной луне'
  - map: новая карта Blueshift (порт с Bubberstation), от 80 игроков
  - map: новая карта NebulaStation (порт с /tg/ через Bubberstation), от 70 игроков
  - map: 'новая карта Catwalk Station (порт с /tg/ через Bubberstation), от 50 игроков:
      станция на мостках над космосом'
  - map: 'новая карта Biodome (порт с Bubberstation), от 50 игроков: парк под куполом
      и вольеры со случайными животными'
  - map: 'новая карта Ouroboros (порт с Bubberstation), от 40 игроков: кольцевая станция
      на луне'
  - map: новая карта Wawastation (порт с Bubberstation), от 20 игроков
  - map: на новых картах в офисе охраны стоит взломанный автолат для патронов .45
  - map: в техах VoidRaptor живут синдикаты с ножом и пауки, без энергомеча и тарантула
  - rscadd: 'транспортная система /tg/: трамвай с пультами, переездами и табло, лифты
      с панелями вызова и индикаторами этажей'
  - rscadd: нижние этажи рисуются со своим освещением и сжимаются с высотой, глубина
      настраивается в секции графики
  - rscadd: сквозь дыру видна окрестность 3x3, сквозь дыру в полу или потолке можно
      посмотреть на соседний этаж
  - rscadd: в невесомости можно спускаться и подниматься по космосу, верхние палубы
      выходят в соседние секторы
  - rscadd: модуль МОДа longfall гасит урон от падения между этажами
  - rscadd: прыжок с разбега перелетает дыру в полу, на IceBox в коробке выживания
      аварийный крюк для подъёма
  - rscadd: Navigate ведёт к лестнице на этаж цели, по трубам можно перебраться между
      палубами
  - rscadd: кнопки смены этажа у ИИ и у консолей с камерой
  - rscadd: блоб прорастает между этажами сквозь дыры
  - balance: решётка над дырой держит вес, но голая решётка замедляет шаг, а на бегу
      по ней можно оступиться
  - balance: снаряжение, отделы, оружейная, комната Авангарда и операционная брига
      на новых картах как на Box, Meta и Delta
  - balance: мобы не ломают машинерию, свои гнёзда и вещи экипажа и бросают преграду,
      которую не могут пробить
  - qol: прутья, плитка и РЦД, кликнутые в дыру, строят в самой дыре
  - bugfix: подъём, падение и лестницы везут пристёгнутых и буксируемых вместе с сиденьем,
      животные лезут по лестнице кликом
  - bugfix: лифт на 4NaL снова ездит
  - bugfix: снова работают ambient occlusion, конус обзора и искажение сингулярности
  - bugfix: ИИ, госты, глаза консолей и камеры видят тот этаж, на который смотрят,
      камеры нижней палубы не показывают чёрный экран
  - bugfix: эффекты, погода, жидкости и свечение видны на нижних этажах и едут вместе
      с носителем
  - bugfix: 'фонари и лампы светят только своему этажу: фонарь на нижней палубе больше
      не высвечивает пол над дырой'
  - bugfix: радиационная буря снова видна, её начало не подвешивает сервер на многоэтажных
      картах, пещеры ледяной луны укрывают от неё
  - bugfix: рация, КПК, датчики экипажа, NTNet и тревоги работают со всеми этажами
      станции
  - bugfix: 'пробоина больше не выкачивает полстанции: файрлоки запирают отсек, в
      том числе через проёмы между этажами'
  - bugfix: многоэтажные карты меньше грузят видеокарту, смена этажа не подтормаживает
  - bugfix: искажение сингулярности больше не тормозит сервер к концу раунда
  - bugfix: мегафауна не пикирует и не телепортируется к цели на другом этаже, аномалии
      не падают между этажами
  - bugfix: ядерная бомба и самоуничтожение убивают на всех палубах станции
  - bugfix: улетевший с многопалубной станции возвращается из космоса на палубу, с
      которой улетел
  - bugfix: на новых картах работают криокапсулы, суперматерия IceBox и VoidRaptor
      питает радколлекторы, SMES движка держат станцию с начала раунда
  - bugfix: шаттл прибытия VoidRaptor стыкуется шлюзом к станции, оба шлюза зала выходят
      в его двери, шахтёры на новых картах доходят до своего шаттла
  - bugfix: на VoidRaptor стрелки указателей смотрят куда надо, у ксенобиологии работают
      скрубберы и вентиляция
  - bugfix: трамвай не сносит постройки на клетке, где под ним меняли пол; поломка
      трамвая случается только при инженере на станции
  - bugfix: пожар на одном азоте гаснет, а не горит часами
  - bugfix: эвак-шаттл, поставленный админом из шаблона, не перехватывает уже вызванный
  - bugfix: похвала в конце раунда больше не задерживает итоги
  - bugfix: тряска экрана не уносит камеру дальше силы тряски
  - bugfix: плитка бассейна кладётся 3 секунды и не под стоящего на клетке
  - bugfix: объявления об угоне эвакуационного шаттла снова приходят
  - bugfix: перила больше не считаются стеной при поиске пути, мобы, боты и Navigate
      огибают ряд перил
  - bugfix: менторхелп открывает панель обращений на вкладке менторов
  - bugfix: портал гостролей на станцию работает на картах без сферы Гильберта
  - bugfix: паучки и медбот с эмагом снова впрыскивают яд
  - bugfix: цвета полихромных вещей из лодаута больше не ломают их отрисовку
  - bugfix: если на карте некуда спавнить латеджойн, игрок попадает в комнату ошибок
      ЦК, а не в пустоту
  - bugfix: Door Runtime снимает болты и ток со всех запертых им дверей
  - bugfix: черта «Reactor cargo contamination» больше не оставляет коллекторы суперматерии
      без радиации
  - bugfix: черта похмелья, отель Гильберта и снос света пустых z-уровней больше не
      подвешивают сервер, голодек и портальные игрушки удаляются без ошибок
  - code_imp: единый API вертикального движения zMove/can_z_move, client.eye меняется
      только через set_eye()
  - admin: панель отладки Multi-Z с дампами плоскостей и связок, аудитом рендера и
      плоскостей этажа
