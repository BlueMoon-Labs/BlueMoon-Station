author: MrPe4henika
delete-after: true
changes:
  - bugfix: Исправлена логика клейкой ленты при контакте с синтетиками. Теперь скотч/клейкая
      лента точно работают как бинты для синтетиков, могут быть сняты, останавливают
      кровотечение.
  - rscadd: Добавлен новый нейтральный квирк - Биогенератор (ТОЛЬКО ДЛЯ СИНТЕТИКОВ).
      Квирк убирает из руки Power Cord и позволяет синтетикам есть обычную пищу, получая
      засчет нее энергию.
  - rscadd: Добавлена возможность синтетикам заряжать свои аккумуляторы с помощью
      зарядных станций для юнитов. Незнаю, почему раньше так нельзя было.
  - bugfix: Исправлена операция на добавления конечностей для Синтетиков, теперь она
      требует не хирургические инструменты, а обычные инженерные.
  - rscadd: Добавлены две операции на восстановления слуха по примеру с восстановлением
      зрения для Органических и Синтетических персонажей со своими потребностями и
      условиями.
  - rscadd: 'Добавлено новое ограничение по использованию эмоутов flip/spin. Если
      персонаж совершает более 3х действий подряд (flip/spin), он получает следующие
      дебафы: Головокружение, тошнота, замедление и сопутствующее оповещение в чате
      об этом.'
