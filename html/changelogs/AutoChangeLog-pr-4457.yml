author: Herobrine998
delete-after: true
changes:
  - bugfix: Исправлены баги и недочёты в работе фотографий. Теперь они должны передавать
      максимально детализированное изображение.
  - rscadd: Добавлен интерфейс фотокамеры с возможностью отключения вспышки без отключения
      освещения.
  - rscadd: На ПДА добавлена программа камеры. Фотографии хранятся локально на ПДА,
      но их можно выгрузить в облако для сохранения между раундами.
  - rscadd: Фотки можно пересылать по ПДА
  - rscadd: 'Добавлены лимиты облачного хранилища: 50 фотографий для обычных игроков,
      200 для донатеров, без ограничений для спонсоров.'
  - qol: В программу камеры добавлено превью, позволяющее заранее оценить, как будет
      выглядеть фотография.
  - rscadd: Добавлена возможность печатать фотографии как с ПДА, так и из облака.
      Для печати необходимо подойти вплотную к принтеру.
  - qol: Фотографии можно редактировать и удалять в любой момент как в локальном,
      так и в облачном хранилище.
  - qol: Для квирка «Фотограф» предусмотрена разовая миграция фотографий в облако.
      В дальнейшем квирк и облачное хранилище никак не будут связаны, поэтому можете
      сами решать, нужен ли он вам (или вообще удалить его нафиг).
  - rscadd: Добавлено новое приложение Syndimatic, позволяющее публиковать фотографии
      в общую ленту, доступную всем пользователям.
  - rscadd: 'Фотографии лимитированы по игроку: 30 фоток для обычного игрока, 60 для
      донатера, 120 для спонсора. Донатеры могут снизить свой лимит, если хоят'
  - rscadd: Фотографии можно лайкать и комментировать, а комментарии — лайкать и дизлайкать.
  - rscadd: В своём профиле можно установить описание и фотографию. По умолчанию используется
      первая фотография вашего персонажа. У каждого персонажа свой профиль.
  - rscadd: В профиле отображаются все ваши публикации, которые ещё не были удалены.
  - rscadd: Автор публикации может закрыть комментарии или удалить публикацию.
  - admin: Администрация может удалять любые публикации и комментарии, а также выдавать
      блокировки на публикацию постов или написание комментариев.
  - qol: Добавлена возможность включать и выключать уведомления о новых публикациях
      по аналогии с уведомлениями мессенджера.
