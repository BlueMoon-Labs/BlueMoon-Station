author: MrPe4henika
delete-after: true
changes:
  - rscadd: Добавлено Малф ИИ получает новую способность для взлома КПБ и Синтетиков.
      Стоимость способности - 30 PT. Находится в жёлтом тире. Каждое использование
      расходует способность и требует покупки заного.
  - rscadd: Добавлено Взломанные синтетики получают сообщения в чат и доступ в бинарный
      канал для связи с ИИ
  - rscadd: Подвезли Взломанные синтетики чинятся с помощью мультитула(если цель связана
      или без сознания) или операции Emergency Reboot
  - rscadd: Завезли задержку на взлом, если синтетик имеет Защиту Разума, ИИ все также
      может взломать синтетика с защитой разума, но ему приходят уведомления о попытках
      взлома, задержка - 5 минуты.
  - rscadd: Добавили задержку на взлом одного и того же синтетика в 30 минут
