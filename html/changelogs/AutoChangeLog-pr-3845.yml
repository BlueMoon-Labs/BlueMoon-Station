changes:
  - rscadd: Добавлены 12 станционных происшествий и транспортные контейнеры с накладными
      и ремонтируемыми затворами.
  - image: Добавлены спрайты и анимации контейнеров, а также эффекты новых происшествий.
  - balance: Снижена частота повторяющихся фоновых событий, скорректированы шансы
      гостевых ролей и пороги экипажа для боевых событий.
  - bugfix: Просмотр рулсетов больше не снижает их вес. Беглецы могут появиться по
      одиночному сценарию при малом числе желающих.
  - admin: Расширены журналы директора и опросов на гостевые роли.
