author: DuLL-FoX
delete-after: true
changes:
  - bugfix: Исполнитель желаний больше не печатает бесконечные деньги, внесение кучи
      наличных не удваивает сумму, найденные наличные учитываются честно.
  - rscadd: Экономическое задание предателя можно один раз заменить на обычное; продажа
      контрабанды больше не выпадает сама, тексты заданий короче.
  - rscadd: 'Новые контракты: аварии инженерии, массовые пострадавшие для медбея,
      эстафеты отделов, обход станции для СБ, работа бара, ботаники, ксенобиологии
      и робототехники; все заказы доски проверены на выполнимость.'
  - rscadd: Магазин в Кошельке, оплата и запрос оплаты у человека рядом, заказ еды
      и напитков в номер отеля Гильберта.
  - qol: Касса принимает КПК и показывает подсказки по шагам; сотрудник заказывает
      недорогой пак отдела с КПК, глава решает заявки кнопками на карте.
  - balance: Грант доливает бюджет до нужного, высокий налог злит экипаж, акции в
      конце смены продаются по рынку, соперники на аукционе скромнее, лимит повторов
      и потолки наград контрактов.
  - rscadd: У Таркова и Deep Space своя доска заказов, сдача сканером продажи.
  - rscadd: Скупка собирается из паков одного отдела, отдел слышит о ней по рации
      и берёт за свой бюджет, первые минуты - только он.
  - qol: Эстафету не обрывает отказ одного игрока, этап ждёт отдел час, о финале и
      скором снятии этапа слышно по рации.
  - qol: Ставку на аукционе можно вписать суммой, кнопка «Перебить соперников» ставит
      нужное одним нажатием.
  - qol: В Кошельке на первом экране блок «Куда потратить», при осмотре своей карты
      есть подсказка.
  - balance: Премии сотрудникам в пределах лимита не открывают дел аудита.
  - bugfix: Стенд оплаты не списывает с голочипа, отданного другому; оружие СБ больше
      не купить лично через скупку.
  - balance: Орбитальные задания после 60 тыс. за смену платят половину награды, а
      не ноль; одно дорогое задание больше не режется.
  - rscadd: Заявку, которую 20 минут никто не решил, могут одобрить начальник снабжения,
      ГП или капитан - недостающее доплатит бюджет снабжения.
  - balance: Отделу не хватает на закупку - до половины цены доплачивает излишек снабжения
      вместо того, чтобы его забрал NT; порог бюджета снабжения 40 тысяч.
  - qol: Излишек бюджетов сначала доливает цели накопления других отделов; о запросе
      в казну капитан и ГП узнают на карту и получают напоминание.
