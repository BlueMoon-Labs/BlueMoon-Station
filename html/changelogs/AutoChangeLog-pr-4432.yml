author: Pingvas
delete-after: true
changes:
  - rscadd: Новый антагонист - Крысиный король.
  - rscadd: Для ерп мобов импрувнуты описания, позволяющие посмотреть на префы игрока.
  - rscadd: Квирк 'мышинный поводырь', позволяющий в мирном режиме управлять толпой
      мышек.
  - rscadd: 'Система рыбалки: удочки и снасти, мини-игра с ловлей, различные места
      и порталы для рыбалки, а также навык и достижения.'
  - rscadd: Pазнообразные виды рыб с индивидуальными особенностями, возможностью расти
      и эволюционировать.
  - rscadd: Добавлены аквариумы с настройками воды и температуры, уходом за рыбами
      и декором.
  - rscadd: Рыбные сумки и кейсы, сети, крепления, анализатор и обновлённый каталог
      рыб.
  - rscadd: Рыбные продукты, блюда, новые товары и рецепты удочек.
  - map: На каждой (почти) станционной карте появились места для ловли рыб.
  - rscadd: Битранинг. Професия, одежда, машинерия.
  - rscadd: На каждой станционной карте появилось месточко для биртрана, находится
      в карго. Для подключения используйте квантум консоль, следом ложитесь в капсулу.
      20+ испытаний, попробуйте себя в каждом. Куча перенесенных механик, декора и
      QoL.
  - rscadd: Для любителей пострелушек доработан режим прицеливания на оружии.
  - bugfix: Освещение в домейнах.
