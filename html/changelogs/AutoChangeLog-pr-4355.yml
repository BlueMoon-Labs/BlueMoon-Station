author: DuLL-FoX
delete-after: true
changes:
  - code_imp: атмос, ИИ мобов, Life() людей, питание и снаряды заметно меньше нагружают
      сервер
  - server: работа вне контроллера (клики, вербы) больше не держит тик целиком, предел
      в конфиге MC_OUTSIDE_TICK_LIMIT
  - server: при старте мира проверяется архив ресурсов и CDN, плохой адрес пишется
      в лог и показывается админам
  - sound: голос VOX Alliance, тетрис и тяжёлый эмбиент перекодированы в ogg, новый
      игрок качает на 120 МБ меньше
  - bugfix: лампы на красном коде больше не перегорают от дозарядки батарейки, выключатель
      с привязанными лампами не путает положение
  - bugfix: мудлет опьянения у органиков снова держится, объявление ИИ из интелкарты
      слышно, химраздатчик не залипает со спиннером
  - bugfix: отель не уводит гостя к удалённой сфере, боссы и кастеры бьют способностями
      в свой темп
  - imageadd: новые эффекты и ауры еретиков Песка, Стекла, Эха, Пустоты, Ржавчины,
      Воска и Духа, сеты Песка и Пучины
