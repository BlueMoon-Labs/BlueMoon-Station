author: DuLL-FoX
delete-after: true
changes:
  - rscadd: Экспорт и импорт слота персонажа теперь идут через JSON-файл на компьютере
      вместо локальной копии BYOND.
  - qol: Передача персонажа по коду переносит только поля персонажа, без валюты и
      данных аккаунта.
  - code_imp: Сохранения игроков переведены в JSON с автоматическим переносом старых
      сейвов и их незалитого журнала настроек.
  - code_imp: Добавлены восстановление предыдущего поколения сейва, защита от записи
      устаревших изменений и повторный перенос после отката на старую сборку.
  - code_imp: Сохранение настроек и персонажа идёт без промежуточного savefile.
  - admin: С правом R_DEBUG доступны просмотр и скачивание сейвов игроков по ckey.
  - server: В резервные копии необходимо включать JSON, файлы .recovery и .legacy
      и каталог .d/. Старые SAV после миграции больше не обновляются; для отката добавлен
      экспорт актуальных данных в SAV.
