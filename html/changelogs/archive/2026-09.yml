  - rscadd: Дилдо при suicide act теперь учитывают наличи узла у себя, отсутствие
      дыхания/наличие квирка "Спермоприёмник" у цели с уникальными результатами при
      таковых.
  - balance: 'Дефибрилляция, операция дефибрилляции, операция ревайвал и нанитная
      программа дефибрилляции накладывает дебаффы: помутнение зрения, тряска экрана
      игрока.'
  - balance: Дефибрилляция теперь учитывает, является ли цель недышащей, накладывая
      на неё аналог софткрита от удушья через статус эффект конфуза и стаминакрита.
  - spellcheck: suicide act дилдо получил перевод своих строк интеракта.
  - code_imp: HealAllImmobilityUpTo получил фикс-соотнесение просчёта Dazed к проку
