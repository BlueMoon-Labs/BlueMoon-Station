      каждые две секунды до конца раунда.
  - code_imp: Уровень с бесполезным сносом света исключается из сносов и под критическим
      давлением памяти.
  - bugfix: Спрайты снарядов вернулись в спрайтшит спавн-панели; CI проверяет формат
      метадаты DMI.
  - bugfix: Смешение цвета жидкости не делит на ноль при нулевом объёме реагента.
  - bugfix: 'Переход из лобби в игру больше не замораживает сервер на девять секунд:
      лидерборд метадолларов пересобирается в фоне.'
