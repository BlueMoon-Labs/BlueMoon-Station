2026-09-01:
  MrPe4henika:
  - rscadd: Скотч теперь является аналогам бинтов для синтетиков
  - rscadd: Возможность переключить, скрывает ли маска ваше лицо и описание на ALT+Клик
      по маске
  - rscadd: Крафт лестницы из 10 металла с удобной системой установки
  - rscadd: Анимация при выливании жидкости из ёмкости с использованием harm
  - rscadd: Персональные вещички чебупеля додо
  - rscadd: Переработан квирк "Водный аспект". Теперь квирк стоит 1 очко(Не мое),
      а также выдает подводное дыхание, дает возможность ускоренно передвигаться в
      воде
  - bugfix: Исправление логики "Уязвимость к воде" для синтетиков с бассейнами
  - rscadd: Синтетики с квирком "Уязвимость к воде" получают урон от контакта с лужами
      воды без сапог
  - rscadd: Автоматические эмоуты вздрагивания и так далее для синтетиков при контакте
      с водой
  - bugfix: Исправление органов ксенохиммер при возраждении. Теперь ксенохиммера просыпается
      с органами поврежденными на 20%, вместо полностью гнилых
  - bugfix: У лестниц в бассейн увеличено сцепление, теперь вы не падает и не ломаете
      себе черепа прямо с лестницы.
  - rscadd: Частично улучшил интерфейс Персонального музыкального проигрывателя, добавив
      кнопочки повтора и так далее для удобства
  - rscadd: Более 10-ти новых автоматических милогов для сигарет. РП КУРЕНИЕ
  - rscadd: В хамелионку боргов добавлены все варианты корпусов
  - rscadd: Hailer из СБТеха теперь можно установить в любую маску/противогаз - и
      дать ей возможности СБ Маски (Рация + Оповещение)
  Rfs-Phi:
  - rscadd: добавил плюшевых мотыльков
  Silver-Paws:
  - rscadd: 'Дефибрилляция, операция дефибрилляции, операция ревайвал и нанитная программа
      дефибрилляции накладывает дебаффы: помутнение зрения, тряска экрана игрока.
      Реанимация сопровождается белым экраном на короткое время. Изменения суммарно
      скорее послеоперационный fluff, нежели что-то всерьёз балансное.'
  - rscadd: При дефибрилляции кукла теперь дёргается вместо задыхания (Эмоутом), если
      не нуждается в дыхании.
  - rscadd: Дилдо при suicide act теперь учитывают наличи узла у себя, отсутствие
      дыхания/наличие квирка "Спермоприёмник" у цели с уникальными результатами при
      таковых.
  - balance: 'Дефибрилляция, операция дефибрилляции, операция ревайвал и нанитная
      программа дефибрилляции накладывает дебаффы: помутнение зрения, тряска экрана
      игрока.'
  - balance: Дефибрилляция теперь учитывает, является ли цель недышащей, накладывая
      на неё аналог софткрита от удушья через статус эффект конфуза и стаминакрита.
  - spellcheck: suicide act дилдо получил перевод своих строк интеракта.
  - code_imp: HealAllImmobilityUpTo получил фикс-соотнесение просчёта Dazed к проку
      setDazed вместо SetImmobilized.
  - code_imp: Квирк не-мёртвый теперь применяет умножение/деление модификатора голода/жажды
      вместо process adjust голода и жажды. На практике это влияет на голод и жажду
      во время активностей куклы.
  - refactor: Трейт отсутствия дыхания теперь возвращает return на adjustOxyLoss,
      де-факто запрещая принимать урон удушьем вне set прока, т.е. в почти всех внутриигровых
      случаях. Квирки не-мёртвый и недышащий теперь не исцеляют урон куклы, в свою
      очередь, ввиду этого рефактора.
