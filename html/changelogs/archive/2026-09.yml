      вместо process adjust голода и жажды. На практике это влияет на голод и жажду
      во время активностей куклы.
  - refactor: Трейт отсутствия дыхания теперь возвращает return на adjustOxyLoss,
      де-факто запрещая принимать урон удушьем вне set прока, т.е. в почти всех внутриигровых
      случаях. Квирки не-мёртвый и недышащий теперь не исцеляют урон куклы, в свою
      очередь, ввиду этого рефактора.
