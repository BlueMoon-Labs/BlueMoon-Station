author: DuLL-FoX
delete-after: true
changes:
  - bugfix: Перчатки-хвататели снова бросаются после того, как свернёшь перчатки МОДа.
  - bugfix: Голосование за режим игры больше не стартует и не закрывается тут же посреди
      раунда.
  - bugfix: Нажатие «Рестарт» во время другого голосования больше не ломает подсчёт
      идущего.
  - qol: Кнопки начала голосования неактивны, пока идёт голосование или не прошёл
      кулдаун, и в подсказке видно почему.
  - qol: 'Окно голосования переделано: крупные варианты с иконками и долей голосов,
      длинный текст переносится, видно кто начал голосование и сколько проголосовало,
      есть таймер и кнопка «Отозвать голос», а варианты рестарта и окончания смены
      написаны по-русски.'
  - bugfix: Снова можно швырнуть человека, которого несёшь на плечах.
  - bugfix: Сверхтяжёлый великан больше не давит людей без гравитации, в полёте или
      с антигравом.
  - bugfix: На мышь и крысу больше не сядет тот, кто крупнее или сверхтяжёлый; седок
      на звере сидит прямо и падает с мёртвого скакуна; транспорт без рук не водят.
  - bugfix: Одежда на тешари больше не превращается в каску, бронежилет или комбинезон,
      капюшон тешарьского плаща снова похож на капюшон.
  - bugfix: Культ и революция больше не ломают друг другу худ.
  - bugfix: Узоры молей больше не налезают на гениталии.
  - bugfix: Ночное зрение, мезоны и термалы не теряют подсветку после смены режима
      HUD или настроек графики, квирк ночного зрения работает сразу.
  - bugfix: Пожарную тревогу снова можно включить сразу после сброса.
  - bugfix: Неудачная попытка усадить персонажа больше не блокирует ему бросок-захват,
      ПНВ шлема HECU выключается при поднятом забрале.
  - qol: Меню ПКМ больше не прячется под окнами переменных и другими окнами; в настройках
      «Меню ПКМ» можно вернуть меню внутрь окна игры.
  - map: 'Void Raptor: у двойного шлюза медбея закрываются обе створки, у входов в
      медбей кнопки дверей снаружи.'
  - map: 'IceMoon: техтоннели у дормиториев больше не открываются на мороз.'
