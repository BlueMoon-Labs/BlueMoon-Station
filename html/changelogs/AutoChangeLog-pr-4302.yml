author: DuLL-FoX
delete-after: true
changes:
  - bugfix: На мульти-Z станциях сквозь космос верхнего этажа виден нижний этаж
  - bugfix: РнД-машины вне станции подключаются к серверу своей базы
  - bugfix: Тело больше не налезает на ноги (особенно у молей)
  - bugfix: Броня священника и латы больше не получают хвост риотки и не пропадают
      на таврах
  - bugfix: Зомби-порошок не вешает синтов в вечную кому, админ-лечение снимает мнимую
      смерть
  - bugfix: Отрубленная голова авангарда возвращается с задания вместе с телом
  - bugfix: Медхуд не показывает неполное здоровье от сотых долей урона, урон от роста
      снимается при уменьшении
  - bugfix: Призыв только с согласия игрока в теле, вещи призванного больше не пропадают
  - balance: Протезы не дают очков особенностей синтетическим видам
  - bugfix: Огнемёт не стреляет с пустым баллоном и не жжёт пол, боевой индуктор заряжает
      энергомагазины
  - bugfix: КПК Призрачного Кафе не видны в мессенджере станции
