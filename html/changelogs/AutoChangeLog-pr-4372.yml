author: FelixRuin
delete-after: true
changes:
  - rscadd: при отсутствии противогаза с квирком "синдром бейна" персонаж начинает
      кашлять и глотать воздух примерно раз в минуту, получая лёгкое головокружение
      вместе с этим. (не происходит если персонаж присмерти или не двигался долгое
      время)
  - balance: отрицательное настроение -4 от квирка "синдром бейна" при отсутствии
      противогаза стал -8
