author: Silver-Paws
delete-after: true
changes:
  - rscadd: Все улучшаемые машины при осмотре теперь получают единую строчку с гиперссылкой,
      открывающей инфо об улучшениях наподобие того, как это сделано с биркой брони
      у одежды с защитой. Гиперссылка открывается только вплотную или при надетых
      и активированных научных очках/при модуле научного сканнера.
  - rscadd: Добавлена секция "Заработок" в вендомат шахтёров.
  - bugfix: Кофе-машина будет отображать ранее не показывавшуюся инфо.
  - bugfix: PACMAN'ы теперь корректно ищут сеть под собой после создания.
  - qol: Рудоплавильная печь теперь отображает сколько очков награды за руду получит
      игрок с учётом улучшений печи.
  - spellcheck: Переведены почти все машины, которые можно улучшить.
  - spellcheck: Переведены TGUI интерфейсы рудоплавильной машины, вендомата шахты,
      компьютера турбины, вендомата за кредиты, PACMAN генераторов, SMES.
  - code_imp: Удалён модульный файл сплуртовского, сэндштормовского, блюмунского вендомата
      шахты, содержимое перенесено в корень.
  - refactor: examine() улучшений машин переделан под examine_display() вариант для
      всех таких машин в билде.
