		for (var key in params) {
			if (!params.hasOwnProperty(key)) continue;
			if (i++ > 0) query += "&";
			var value = params[key];
			if (value === null || typeof value === "undefined") value = "";
			query += encodeURIComponent(key) + "=" + encodeURIComponent(value);
		}
	}
	var rawUrl = (path || "") + "?" + query;
	var protocolUrl = "byond://" + rawUrl;
	if (window.cef_to_byond) {
		try { window.cef_to_byond(protocolUrl); return true; } catch (e) {}
	}
	try { window.location.href = protocolUrl; return true; } catch (e) {}
	try { var xhr = new XMLHttpRequest(); xhr.open("GET", rawUrl); xhr.send(); return true; } catch (e) {}
	return false;
}

function byond_winset(params) {
	byond_bridge_call("winset", params || {});
}

function byond_topic(href) {
	var protocolUrl = "byond://" + href;
	if (window.cef_to_byond) {
		try { window.cef_to_byond(protocolUrl); return true; } catch (e) {}
	}
	try { window.location.href = protocolUrl; return true; } catch (e) {}
	try { var xhr = new XMLHttpRequest(); xhr.open("GET", href); xhr.send(); return true; } catch (e) {}
	return false;
}

	if (connected) {

	} else {

function getTabOrder(name) {
	if (name === "Status") return 1;
	if (name === "MC") return 2;
	if (name === "Избранное") return 3;
	return 100 + name.charCodeAt(0);
}

function resolveTabDisplayName(name) {
	if (name.indexOf(".") !== -1) {
		var parts = name.split(".");
		if (State.splitAdminTabs && parts[0] === "Admin") return parts[1];
		return parts[0];
	}
	return name;
}

function createStatusTab(name) {
	var display = resolveTabDisplayName(name);
	if (display.trim() === "") return;
	if (document.getElementById("tab-" + display)) return;
	if (!State.verbTabs.includes(display) && !State.permanentTabs.includes(display)) return;

	var btn = el("button", "tab-btn");
	btn.id = "tab-" + display;
	btn.textContent = display;
	btn.style.order = getTabOrder(display);
	if (display === "Избранное") btn.classList.add("tab-fav");
	btn.onclick = function() {
		tab_change(display);
		this.blur();
	};

	var spacerEl = document.getElementById("tab-bar-spacer");
	if (spacerEl) {
		tabBar.insertBefore(btn, spacerEl);
	} else {
		tabBar.appendChild(btn);
	}
	SendTabToByond(display);
	spacer.style.height = tabBar.offsetHeight + "px";
}

function removeStatusTab(name) {
	var btn = document.getElementById("tab-" + name);
	if (!btn || State.permanentTabs.includes(name)) return;
	for (var i = State.verbTabs.length - 1; i >= 0; --i) {
		if (State.verbTabs[i] === name) State.verbTabs.splice(i, 1);
	}
	btn.parentNode.removeChild(btn);
	TakeTabFromByond(name);
	spacer.style.height = tabBar.offsetHeight + "px";
}

function addPermanentTab(name) {
	if (!State.permanentTabs.includes(name)) State.permanentTabs.push(name);
	createStatusTab(name);
}

function removePermanentTab(name) {
	for (var i = State.permanentTabs.length - 1; i >= 0; --i) {
		if (State.permanentTabs[i] === name) State.permanentTabs.splice(i, 1);
	}
	removeStatusTab(name);
}

function checkStatusTab() {
	var children = tabBar.children;
	for (var i = children.length - 1; i >= 0; i--) {
		var child = children[i];
		if (child.id === "tab-search-btn" || child.id === "tab-bar-spacer" || child.id === "settings-gear-btn") continue;
		var tabName = child.id.replace("tab-", "");
		if (!State.verbTabs.includes(tabName) && !State.permanentTabs.includes(tabName)) {
			tabBar.removeChild(child);
		}
	}
}

function tab_change(tab) {
	_settingsActive = false;
	if (tab === State.currentTab) return;
	var oldBtn = document.getElementById("tab-" + State.currentTab);

	State.currentTab = tab;
	set_byond_tab(tab);
	var newBtn = document.getElementById("tab-" + tab);
	if (newBtn) newBtn.classList.add("active");
	closeGlobalSearch();
	invalidateRenderers();
	renderCurrentTab();
	byond_winset({ "statbrowser.is-visible": "true" });
}

function sortVerbs() {

		var sel = a[0] === b[0] ? 1 : 0;
		var av = a[sel].toUpperCase();
		var bv = b[sel].toUpperCase();
		if (av < bv) return 1;
		if (av > bv) return -1;
		return 0;
	});
}

function findVerbIndex(name, verblist) {
	for (var i = 0; i < verblist.length; i++) {
		if (verblist[i][1] === name) return i;
	}
	return -1;
}

function remove_verb(v) {
	for (var i = State.verbs.length - 1; i >= 0; i--) {
		if (State.verbs[i][1] === v[1]) State.verbs.splice(i, 1);
	}
}

function check_verbs() {
	for (var v = State.verbTabs.length - 1; v >= 0; v--) {
		verbs_cat_check(State.verbTabs[v]);
	}
}

function verbs_cat_check(cat) {
	var tabCat = resolveTabDisplayName(cat);
	if (!State.verbTabs.includes(tabCat)) {
		removeStatusTab(tabCat);
		return;
	}
	var found = false;
	for (var v = 0; v < State.verbs.length; v++) {
		var verbcat = resolveTabDisplayName(State.verbs[v][0]);
		if (verbcat === tabCat && verbcat.trim() !== "") {
			found = true;
			break;
		}
	}
	if (!found) {
		removeStatusTab(tabCat);
		if (State.currentTab === tabCat) tab_change("Status");
	}
}

function wipe_verbs() {
	State.verbs = [];
	State.verbTabs = [];
	checkStatusTab();
}

	saveFavorites();
	updateFavoritesTab();
	if (State.currentTab === "Избранное" || State.verbTabs.includes(State.currentTab)) {

}

	}
}

function applyTheme(themeState) {
	var root = document.documentElement;
	var preset = THEME_PRESETS[themeState.preset];
	if (preset) {
		for (var key in preset.vars) {
			root.style.setProperty(key, preset.vars[key]);
		}
	}
	for (var key in themeState.overrides) {
		root.style.setProperty(key, themeState.overrides[key]);
	}
	if (themeState.fontFamily) {
		root.style.setProperty("--font-sans", themeState.fontFamily);
	}
	root.style.setProperty("--font-size", themeState.fontSize + "px");
	root.style.setProperty("--border-radius", themeState.borderRadius + "px");
	if (!_customStyleEl) {
		_customStyleEl = document.createElement("style");
		_customStyleEl.id = "custom-theme-css";
		document.head.appendChild(_customStyleEl);
	}
	_customStyleEl.textContent = themeState.customCSS || "";
	document.body.classList.remove("light");
}

function getCurrentVarValues(themeState) {
	var result = {};
	var preset = THEME_PRESETS[themeState.preset];
	if (preset) {
		for (var key in preset.vars) {
			result[key] = preset.vars[key];
		}
	}
	for (var key in themeState.overrides) {
		result[key] = themeState.overrides[key];
	}
	return result;
}

	} catch (e) {}
	return null;
}

function normalizeToHex(color) {
	if (!color) return "#000000";
	if (color.charAt(0) === "#" && color.length === 7) return color;
	if (color.charAt(0) === "#" && color.length === 4) {
		return "#" + color[1]+color[1] + color[2]+color[2] + color[3]+color[3];
	}
	var tmp = document.createElement("div");
	tmp.style.color = color;
	document.body.appendChild(tmp);
	var computed = getComputedStyle(tmp).color;
	document.body.removeChild(tmp);
	var match = computed.match(/\d+/g);
	if (match && match.length >= 3) {
		return "#" + ((1 << 24) + (parseInt(match[0]) << 16) + (parseInt(match[1]) << 8) + parseInt(match[2]))
			.toString(16).slice(1);
	}
	return "#000000";
}

	return item;
}

function fillGrid(container, rows) {
	var hash = "";
	for (var j = 0; j < rows.length; j++) hash += rows[j][0] + "\t" + rows[j][1] + "\n";
	if (container._lastHash === hash) return;
	container._lastHash = hash;
	container.textContent = "";
	for (var i = 0; i < rows.length; i++) {
		var wide = ("" + rows[i][1]).length > 32;
		container.appendChild(makeGridItem(rows[i][0], rows[i][1], wide));
	}
}

function makeSectionHeader(key, label, sections) {
	var div = el("div", "section-header");
	var arrow = el("span", "section-arrow", sections[key] ? "▼" : "▶");
	div.appendChild(arrow);
	div.appendChild(document.createTextNode(" " + label));
	div.onclick = function() {
		sections[key] = !sections[key];
		arrow.textContent = sections[key] ? "▼" : "▶";
		div._toggle(key);
	};
	div._arrow = arrow;
	div._toggle = function() {};
	return div;
}

function buildSparkline(data, minVal, maxVal, colorClass) {
	var W = 80, H = 24;
	var ns = "http://www.w3.org/2000/svg";
	var svg = document.createElementNS(ns, "svg");
	svg.setAttribute("width", W);
	svg.setAttribute("height", H);
	svg.setAttribute("viewBox", "0 0 " + W + " " + H);
	svg.setAttribute("class", "sparkline");

	var dMin = Infinity, dMax = -Infinity;
	for (var i = 0; i < data.length; i++) {
		var v = parseFloat(data[i]) || 0;
		if (v < dMin) dMin = v;
		if (v > dMax) dMax = v;
	}
	var lo = Math.min(minVal, dMin);
	var hi = Math.max(maxVal, dMax);
	if (hi === lo) hi = lo + 1;

	var points = [];
	var step = W / Math.max(data.length - 1, 1);
	for (var i = 0; i < data.length; i++) {
		var v = parseFloat(data[i]) || 0;
		var x = Math.round(step * i * 10) / 10;
		var y = Math.round((H - 2) - ((v - lo) / (hi - lo)) * (H - 4) + 2);
		points.push(x + "," + y);
	}

	var polyline = document.createElementNS(ns, "polyline");
	polyline.setAttribute("points", points.join(" "));
	polyline.setAttribute("fill", "none");
	polyline.setAttribute("stroke-width", "1.5");
	polyline.setAttribute("stroke-linejoin", "round");

	var color = "var(--health-good)";
	if (colorClass && colorClass.indexOf("bad") !== -1) color = "var(--health-bad)";
	else if (colorClass && colorClass.indexOf("warn") !== -1) color = "var(--health-warn)";
	polyline.setAttribute("stroke", color);

	svg.appendChild(polyline);
	return svg;
}

function draw_status() {
	if (!document.getElementById("tab-Status")) {
		createStatusTab("Status");
		State.currentTab = "Status";
	}

	var d = {};
	if (State.globalFast) {
		for (var k in State.globalFast) d[k] = State.globalFast[k];
	}
	if (State.globalSlow) {
		d.server = State.globalSlow;
	}
	if (State.tidiData) {
		d.tidi = State.tidiData;
	}

	if (!State.globalFast && !State.pingData) {
		statcontent.textContent = "Загрузка...";
		return;
	}

	st_ensureSkeleton();

	if (d.shuttle) {
		st_els.shuttle.style.display = "";
		setText(st_els.shuttle, ">> " + d.shuttle[0] + " " + d.shuttle[1]);
		st_els.shuttle.className = "shuttle-bar shuttle-warn";
	} else {
		st_els.shuttle.style.display = "none";
	}

	if (st_sections.round && d.server) {
		fillGrid(st_els.roundGrid, d.server);
		st_els.roundGrid.style.display = "";
	} else if (!st_sections.round) {
		st_els.roundGrid.style.display = "none";
	}

	if (st_sections.time && d.time) {
		fillGrid(st_els.timeGrid, d.time);
		st_els.timeGrid.style.display = "";
	} else if (!st_sections.time) {
		st_els.timeGrid.style.display = "none";
	}

	if (st_sections.character) {
		var charHash = State.mobItems.join("\n");
		if (st_els.charTable._lastHash !== charHash) {
			st_els.charTable._lastHash = charHash;
			st_els.charTable.textContent = "";
			for (var i = 0; i < State.mobItems.length; i++) {
				var item = State.mobItems[i];
				if (typeof item !== "string" || item.trim() === "") continue;
				var parsed = st_parseMobItem(item);
				if (parsed) {
					var tr = el("tr");
					var td1 = el("td", "data-label", parsed[0]);
					var td2 = el("td", "data-value", parsed[1]);
					tr.appendChild(td1);
					tr.appendChild(td2);
					st_els.charTable.appendChild(tr);
				} else {
					var tr2 = el("tr");
					var td = el("td", "data-value", item);
					td.colSpan = 2;
					tr2.appendChild(td);
					st_els.charTable.appendChild(tr2);
				}
			}
		}
		var hasItems = State.mobItems.length > 0;
		st_els.charTable.style.display = hasItems ? "" : "none";
		st_els.charHeader.style.display = hasItems ? "" : "none";
	} else {
		st_els.charTable.style.display = "none";
	}

	var vp = State.voteParts;
	if (vp && vp[0] && vp[0][0]) {
		st_els.voteSection.style.display = "";
		st_els.voteSection.textContent = "";
		var table = el("table", "vote-table");
		for (var i = 0; i < vp.length; i++) {
			var part = vp[i];
			var tr = el("tr");
			var td1 = el("td", null, part[0]);
			var td2 = el("td");
			if (part[2]) {
				var a = el("a");
				a.href = "#";
				a.style.cursor = "pointer";
				if (part[2] === "disabled") {
					a.onclick = function(e) {
						if (e && e.preventDefault) e.preventDefault();
						byond_winset({ command: "Vote" });
						return false;
					};
				} else {
					a.onclick = (function(ref) {
						return function(e) {
							if (e && e.preventDefault) e.preventDefault();
							byond_topic("?src=" + ref);
							return false;
						};
					})(part[2]);
				}
				a.textContent = part[1];
				td2.appendChild(a);
			} else {
				td2.textContent = part[1];
			}
			tr.appendChild(td1);
			tr.appendChild(td2);
			table.appendChild(tr);
		}
		st_els.voteSection.appendChild(table);
	} else {
		st_els.voteSection.style.display = "none";
	}

	if (State.verbTabs.length === 0 || !State.verbs) {
		send_byond_command("Fix-Stat-Panel");
	}
}

function mc_matchesFilter(name) {

	return name.toLowerCase().indexOf(State.mcFilterText) !== -1;

		mc_ss_rows[name].style.display = mc_matchesFilter(name) ? "" : "none";
	}
}

function mc_sortAndReorder() {
	var rows = [];
	for (var name in mc_ss_rows) rows.push(mc_ss_rows[name]);
	var col = State.mcSortCol;
	var asc = State.mcSortAsc;
	rows.sort(function(a, b) {
		var ad = a._ssData;
		var bd = b._ssData;
		if (ad[SS_CAN_FIRE] !== bd[SS_CAN_FIRE]) return bd[SS_CAN_FIRE] - ad[SS_CAN_FIRE];
		if (col === SS_NAME) {
			var av = ("" + ad[col]).toLowerCase();
			var bv = ("" + bd[col]).toLowerCase();
			return asc ? (av < bv ? -1 : av > bv ? 1 : 0)
					   : (bv < av ? -1 : bv > av ? 1 : 0);
		}
		var an = parseFloat(ad[col]) || 0;
		var bn = parseFloat(bd[col]) || 0;
		return asc ? (an - bn) : (bn - an);
	});
	for (var i = 0; i < rows.length; i++) {
		if (mc_els.ssTbody.childNodes[i] !== rows[i]) {
			mc_els.ssTbody.insertBefore(rows[i], mc_els.ssTbody.childNodes[i]);
		}
	}
}

function mc_updateSortIndicators() {
	if (!mc_els.ssTable) return;
	var ths = mc_els.ssTable.getElementsByTagName("th");
	for (var i = 0; i < ths.length; i++) {
		var col = parseInt(ths[i].getAttribute("data-col"));
		if (col === State.mcSortCol) {
			ths[i].className = "mc-th-sort mc-sorted" + (State.mcSortAsc ? "" : " desc");
		} else {
			ths[i].className = "mc-th-sort";
		}
	}
}

function mc_updateSSRows() {
	var seen = {};
	for (var i = 0; i < State.mcSSData.length; i++) {
		var row = State.mcSSData[i];
		var name = row[SS_NAME];
		seen[name] = true;
		var tr = mc_ss_rows[name];
		if (!tr) {
			tr = el("tr");
			for (var c = 0; c < 7; c++) tr.appendChild(el("td"));
			mc_ss_rows[name] = tr;
			mc_els.ssTbody.appendChild(tr);
		}
		var cells = tr.childNodes;
		var state_letter = STATE_LETTERS[row[SS_STATE]] || "?";
		var can_fire = row[SS_CAN_FIRE];

		setText(cells[0], state_letter);
		cells[0].className = "mc-state mc-state-" + row[SS_STATE];

		var link = tr._nameLink;
		if (!link) {
			cells[1].textContent = "";
			link = el("a");
			cells[1].appendChild(link);
			tr._nameLink = link;
		}
		var dname = row[SS_IS_BG] ? name + " [BG]" : name;
		if (link.textContent !== dname) link.textContent = dname;
		link.href = "#";
		link.onclick = (function(r) {
			return function(e) { e.preventDefault(); byond_topic(mcMakeVvLink(r)); return false; };
		})(row[SS_REF]);
		cells[1].className = !can_fire ? "mc-name mc-offline" : (row[SS_IS_BG] ? "mc-name mc-bg" : "mc-name");

		if (!can_fire) {
			setText(cells[2], "-"); cells[2].className = "mc-num";
			setText(cells[3], "-"); cells[3].className = "mc-num";
			setText(cells[4], "-"); cells[4].className = "mc-num";
			setText(cells[5], "-"); cells[5].className = "mc-num";
			setText(cells[6], row[SS_FIRED]); cells[6].className = "mc-num";
		} else {
			var cost = row[SS_COST];
			var tick = row[SS_TICK];
			var overrun = row[SS_OVERRUN];
			setText(cells[2], cost); cells[2].className = "mc-num " + mcHealthCost(cost);
			setText(cells[3], tick); cells[3].className = "mc-num " + mcHealthTick(tick);
			setText(cells[4], overrun); cells[4].className = "mc-num " + mcHealthOverrun(overrun);
			setText(cells[5], row[SS_TICKS]); cells[5].className = "mc-num";
			setText(cells[6], row[SS_FIRED]); cells[6].className = "mc-num";
		}

		tr._ssData = row;
		tr.style.display = mc_matchesFilter(name) ? "" : "none";
	}
	for (var n in mc_ss_rows) {
		if (!seen[n]) {
			mc_els.ssTbody.removeChild(mc_ss_rows[n]);
			delete mc_ss_rows[n];
		}
	}
	mc_sortAndReorder();
	State.mcSortDirty = false;
}

var verbSearchTimers = {};

function draw_verbs(cat) {
	statcontent.textContent = "";

	var searchInput = el("input", "verb-search");
	searchInput.type = "text";
	searchInput.placeholder = "Поиск команд...";
	searchInput.autocomplete = "off";
	statcontent.appendChild(searchInput);

	var container = el("div");
	statcontent.appendChild(container);

	function renderVerbsFiltered(query) {
		container.textContent = "";
		var grid = el("div", "verb-grid");
		var additions = {};
		sortVerbs();

		var resolvedCat = cat;
		if (State.splitAdminTabs && cat.lastIndexOf(".") !== -1) {
			var sp = cat.split(".");
			if (sp[0] === "Admin") resolvedCat = sp[1];
		}

		var reversed = State.verbs.slice().reverse();
		for (var i = 0; i < reversed.length; i++) {
			var part = reversed[i];
			var verbCat = part[0];
			if (State.splitAdminTabs && verbCat.lastIndexOf(".") !== -1) {
				var sp2 = verbCat.split(".");
				if (sp2[0] === "Admin") verbCat = sp2[1];
			}
			var command = part[1];
			if (!command) continue;
			if (verbCat.lastIndexOf(resolvedCat, 0) !== 0) continue;
			if (verbCat.length !== resolvedCat.length && verbCat.charAt(resolvedCat.length) !== ".") continue;

			if (query && command.toLowerCase().indexOf(query) === -1) continue;

			var subCat = verbCat.lastIndexOf(".") !== -1 ? verbCat.split(".")[1] : null;
			if (subCat && !additions[subCat]) {
				additions[subCat] = el("div", "verb-grid");
			}

			var pill = el("a", "verb-pill");
			pill.href = "#";
			if (isFavorite(part[0], command)) pill.classList.add("favorited");
			pill.textContent = command;
			pill.onclick = makeVerbOnclick(command);
			pill.oncontextmenu = (function(verbCatOrig, cmd) {
				return function(e) {
					e.preventDefault();
					toggleFavorite(verbCatOrig, cmd);
				};
			})(part[0], command);

			(subCat ? additions[subCat] : grid).appendChild(pill);
		}

		container.appendChild(grid);

		for (var subKey in additions) {
			if (additions.hasOwnProperty(subKey)) {
				container.appendChild(el("div", "verb-sub-header", subKey));
				container.appendChild(additions[subKey]);
			}
		}
	}

	renderVerbsFiltered("");

	searchInput.oninput = function() {
		var val = this.value.toLowerCase();
		clearTimeout(verbSearchTimers[cat]);
		verbSearchTimers[cat] = setTimeout(function() {
			renderVerbsFiltered(val);
		}, 150);
	};
}

function makeVerbOnclick(command) {
	return function(e) {
		e.preventDefault();
		run_after_focus(function() {
			send_byond_command(command.replace(/\s/g, "-"));
		});
	};
}

var turfTable = null;
var turfItemNodes = {};

function iconError() {
	var that = this;
	setTimeout(function() {
		var current_attempts = that.getAttribute("data-retry") || 0;
		current_attempts = parseInt(current_attempts);
		if (current_attempts > State.imageRetryLimit) return;
		var src = that.src;
		that.src = "";
		that.src = src + "#" + current_attempts;
		that.setAttribute("data-retry", current_attempts + 1);
	}, State.imageRetryDelay);
}

function draw_listedturf() {
	if (!turfTable || !turfTable.parentNode) {
		statcontent.textContent = "";
		turfTable = el("div");
		turfItemNodes = {};
		statcontent.appendChild(turfTable);
	}

	var newData = {};
	for (var i = 0; i < State.turfContents.length; i++) {
		newData[State.turfContents[i][1]] = State.turfContents[i];
	}

	for (var ref in turfItemNodes) {
		if (!(ref in newData)) {
			turfTable.removeChild(turfItemNodes[ref]);
			delete turfItemNodes[ref];
		}
	}

	var nextSibling = turfTable.firstChild;
	for (var i = 0; i < State.turfContents.length; i++) {
		var part = State.turfContents[i];
		var ref = part[1];

		if (ref in turfItemNodes) {
			var container = turfItemNodes[ref];
			var nameEl = container.querySelector(".turf-item-name");
			if (nameEl && nameEl.textContent !== part[0]) {
				nameEl.textContent = part[0];
			}
			if (container !== nextSibling) {
				turfTable.insertBefore(container, nextSibling);
			} else {
				nextSibling = nextSibling ? nextSibling.nextSibling : null;
			}
		} else {
			var container = el("div", "turf-item");
			var img = el("img");
			if (!State.storedImages[ref] && part[2]) {
				img.src = part[2];
				State.storedImages[ref] = part[2];
			} else if (State.storedImages[ref]) {
				img.src = State.storedImages[ref];
			}
			img.onerror = iconError;
			container.appendChild(img);
			var nameSpan = el("span", "turf-item-name", part[0]);
			container.appendChild(nameSpan);
			container.onmousedown = (function(p) {
				return function(e) {
					e.preventDefault();
					var clickcatcher = "?src=_statpanel_;statpanel_item_target=" + p[1];
					switch (e.button) {
						case 1: clickcatcher += ";statpanel_item_click=middle"; break;
						case 2: clickcatcher += ";statpanel_item_click=right"; break;
						default: clickcatcher += ";statpanel_item_click=left";
					}
					if (e.shiftKey) clickcatcher += ";statpanel_item_shiftclick=1";
					if (e.ctrlKey) clickcatcher += ";statpanel_item_ctrlclick=1";
					if (e.altKey) clickcatcher += ";statpanel_item_altclick=1";
					byond_topic(clickcatcher);
				};
			})(part);
			turfItemNodes[ref] = container;
			turfTable.insertBefore(container, nextSibling);
		}
	}
}

var pixelRatio = window.devicePixelRatio || 1;
var statbrowserBaseZoom = pixelRatio !== 1 ? (100 / pixelRatio) : 100;
var statbrowserUserZoom = 1;
var zoomHideTimer = null;
var zoomPersistTimer = null;

function clampZoom(value) {
	return Math.min(2.0, Math.max(0.5, value));
}

function applyZoom() {
	document.body.style.zoom = (statbrowserBaseZoom * statbrowserUserZoom) + "%";
}

function showZoomIndicator() {
	zoomIndicator.textContent = "Scale: " + Math.round(statbrowserUserZoom * 100) + "%";
	zoomIndicator.style.opacity = "1";
	clearTimeout(zoomHideTimer);
	zoomHideTimer = setTimeout(function() {
		zoomIndicator.style.opacity = "0";
	}, 1200);
}

function scheduleZoomPersist() {
	clearTimeout(zoomPersistTimer);
	zoomPersistTimer = setTimeout(function() {
		byond_topic(
			"?src=_statpanel_;statbrowser_zoom_save=1;zoom_value="
			+ encodeURIComponent(String(statbrowserUserZoom))
		);
	}, 200);
}

function set_zoom_pref(value) {
	var parsed = Number(value);
	if (!isFinite(parsed) || parsed <= 0) return;
	statbrowserUserZoom = clampZoom(parsed);
	applyZoom();
}

function updateZoom(delta) {
	statbrowserUserZoom = clampZoom(Math.round((statbrowserUserZoom + delta) * 100) / 100);
	applyZoom();
	scheduleZoomPersist();
	showZoomIndicator();
}

window.addEventListener("wheel", function(event) {
	if (!event.ctrlKey) return;
	var direction = Math.sign(event.deltaY);
	if (!direction) return;
	event.preventDefault();
	updateZoom(direction < 0 ? 0.1 : -0.1);
}, { passive: false });

applyZoom();

	State.spellTabs = JSON.parse(t);
	var doUpdate = State.spellTabs.includes(State.currentTab);
	init_spells();
	if (s) {
		State.spells = JSON.parse(s);
		if (!_settingsActive && doUpdate) draw_spells(State.currentTab);

	for (var s = 0; s < State.spellTabs.length; s++) {
		removeStatusTab(State.spellTabs[s]);
	}

function init_spells() {
	for (var i = 0; i < State.spellTabs.length; i++) {
		var cat = State.spellTabs[i];
		if (cat.length > 0) {
			if (!State.verbTabs.includes(cat)) State.verbTabs.push(cat);
			createStatusTab(cat);
		}
	}

	for (var v = 0; v < State.spellTabs.length; v++) {
		spell_cat_check(State.spellTabs[v]);
	}

function spell_cat_check(cat) {
	var count = 0;
	for (var s = 0; s < State.spells.length; s++) {
		if (State.spells[s][0] === cat) count++;
	}
	if (count < 1) removeStatusTab(cat);
}

	var body = el("div");
	var header = el("h3", null, "Interviews");
	body.appendChild(header);
	var manLink = el("a", null, "Open Interview Manager Panel");
	manLink.href = "?_src_=holder;admin_token=" + State.hrefToken + ";interview_man=1;statpanel_item_click=left";
	body.appendChild(manLink);

	var statsTable = el("table", "data-table");
	for (var key in State.interviewManager.status) {
		var tr = el("tr");
		tr.appendChild(el("td", "data-label", key));
		tr.appendChild(el("td", "data-value", State.interviewManager.status[key]));
		statsTable.appendChild(tr);
	}
	body.appendChild(statsTable);
	statcontent.appendChild(body);

	if (State.interviewManager.interviews) {
		for (var i = 0; i < State.interviewManager.interviews.length; i++) {
			var part = State.interviewManager.interviews[i];
			var card = el("div", "ticket-card");
			var a = el("a", null, part["status"]);
			a.href = "?_src_=holder;admin_token=" + State.hrefToken + ";interview=" + part["ref"] + ";statpanel_item_click=left";
			card.appendChild(a);
			statcontent.appendChild(card);
		}
	}
}

function update_sdql2(S) {
	State.sdql2 = JSON.parse(S);
	if (State.sdql2.length > 0 && !State.verbTabs.includes("SDQL2")) {
		State.verbTabs.push("SDQL2");
		addPermanentTab("SDQL2");
	}
	if (!_settingsActive && State.currentTab === "SDQL2") draw_sdql2();
}

function remove_sdql2() {
	State.sdql2 = [];
	removePermanentTab("SDQL2");
	if (State.currentTab === "SDQL2") tab_change("Status");
	checkStatusTab();
}

function remove_tickets() {
	State.tickets = [];
	removePermanentTab("Tickets");
	if (State.currentTab === "Tickets") tab_change("Status");
	checkStatusTab();
}

function remove_interviews() {
	State.tickets = [];
	checkStatusTab();
}

function remove_admin_tabs() {
	State.hrefToken = null;
	remove_mc();
	remove_tickets();
	remove_sdql2();
}

function add_admin_tabs(ht) {
	State.hrefToken = ht;
	addPermanentTab("MC");
	addPermanentTab("Tickets");
}

function create_listedturf(TN) {
	remove_listedturf();
	State.turfContents = [];
	State.turfName = JSON.parse(TN);
	addPermanentTab(State.turfName);
	tab_change(State.turfName);
}

function update_listedturf(TC) {
	if (TC === State.turfContentsRaw) return;
	State.turfContentsRaw = TC;
	State.turfContents = JSON.parse(TC);
	if (!_settingsActive && State.currentTab === State.turfName) draw_listedturf();
}

function remove_listedturf() {
	removePermanentTab(State.turfName);
	State.turfContentsRaw = "";
	turfTable = null;
	turfItemNodes = {};
	checkStatusTab();
	if (State.currentTab === State.turfName) tab_change("Status");
}

function init_verbs(c, v) {
	connected_to_server();
	wipe_verbs();
	checkStatusTab();
	State.verbTabs = JSON.parse(c);
	State.verbTabs.sort();
	var doUpdate = false;
	for (var i = 0; i < State.verbTabs.length; i++) {
		createStatusTab(State.verbTabs[i]);
	}
	if (State.verbTabs.includes(State.currentTab)) doUpdate = true;
	if (v) {
		add_verb_list(v);
		sortVerbs();
		if (!_settingsActive && doUpdate) draw_verbs(State.currentTab);
	}
	SendTabsToByond();
}

function add_verb_list(v) {
	var toAdd = JSON.parse(v);
	toAdd.sort();
	for (var i = 0; i < toAdd.length; i++) {
		var part = toAdd[i];
		if (!part[0]) continue;
		var category = resolveTabDisplayName(part[0]);
		if (findVerbIndex(part[1], State.verbs) !== -1) continue;
		if (State.verbTabs.includes(category)) {
			State.verbs.push(part);
			if (!_settingsActive && State.currentTab === category) draw_verbs(category);
		} else if (category) {
			State.verbTabs.push(category);
			State.verbs.push(part);
			createStatusTab(category);
		}
	}
}

function remove_verb_list(v) {
	var toRemove = JSON.parse(v);
	for (var i = 0; i < toRemove.length; i++) {
		remove_verb(toRemove[i]);
	}
	check_verbs();
	sortVerbs();
	if (!_settingsActive && State.verbTabs.includes(State.currentTab)) draw_verbs(State.currentTab);
}

function update_split_admin_tabs(status) {
	status = (status === true);
	if (State.splitAdminTabs !== status) {
		if (State.splitAdminTabs === true) {
			removeStatusTab("Events");
			removeStatusTab("Fun");
			removeStatusTab("Game");
		}
		update_verbs();
	}
	State.splitAdminTabs = status;
}


function create_debug() {
	if (!document.getElementById("tab-Debug Stat Panel")) {
		addPermanentTab("Debug Stat Panel");
	} else {
		removePermanentTab("Debug Stat Panel");
	}
}

function reapply_storage() {
	applyTheme(loadTheme());
	loadFavorites();
}

var globalSearchTimer = null;

function openGlobalSearch() {
	globalSearchOverlay.classList.add("visible");
	globalSearchBox.value = "";
	globalSearchBox.focus();
	renderGlobalSearchResults("");
}

function closeGlobalSearch() {
	globalSearchOverlay.classList.remove("visible");
	globalSearchBox.value = "";
	globalSearchResults.textContent = "";
}

function renderGlobalSearchResults(query) {
	globalSearchResults.textContent = "";
	query = query.toLowerCase().trim();
	if (!query) return;

	var byCategory = {};
	for (var i = 0; i < State.verbs.length; i++) {
		var part = State.verbs[i];
		var command = part[1];
		if (!command) continue;
		if (command.toLowerCase().indexOf(query) === -1) continue;
		var cat = resolveTabDisplayName(part[0]);
		if (!byCategory[cat]) byCategory[cat] = [];
		byCategory[cat].push(part);
	}

	for (var cat in byCategory) {
		if (!byCategory.hasOwnProperty(cat)) continue;
		globalSearchResults.appendChild(el("div", "search-cat-header", cat));
		var items = byCategory[cat];
		for (var j = 0; j < items.length; j++) {
			var item = el("a", "search-result-item", items[j][1]);
			item.href = "#";
			item.onclick = (function(cmd) {
				return function(e) {
					e.preventDefault();
					closeGlobalSearch();
					run_after_focus(function() {
						send_byond_command(cmd.replace(/\s/g, "-"));
					});
				};
			})(items[j][1]);
			globalSearchResults.appendChild(item);
		}
	}
}

globalSearchBox.oninput = function() {
	clearTimeout(globalSearchTimer);
	var val = this.value;
	globalSearchTimer = setTimeout(function() {
		renderGlobalSearchResults(val);
	}, 150);
};

globalSearchOverlay.onclick = function(e) {
	if (e.target === globalSearchOverlay) closeGlobalSearch();
};

document.addEventListener("keydown", function(e) {
	if (e.key === "Escape" && globalSearchOverlay.classList.contains("visible")) {
		closeGlobalSearch();
	}
});

var _settingsActive = false;

function draw_settings() {
	_settingsActive = true;
	statcontent.textContent = "";
	var themeState = loadTheme();
	var panel = el("div", "settings-panel");

	var presetSection = el("div", "settings-section");
	presetSection.appendChild(el("div", "settings-section-title", "Тема"));
	var presetGrid = el("div", "settings-preset-grid");
	for (var key in THEME_PRESETS) {
		(function(k) {
			var btn = el("button", "settings-preset-btn" + (themeState.preset === k ? " active" : ""));
			btn.textContent = THEME_PRESETS[k].name;
			btn.onclick = function() {
				themeState.preset = k;
				themeState.overrides = {};
				saveTheme(themeState);
				applyTheme(themeState);
				draw_settings();
			};
			presetGrid.appendChild(btn);
		})(key);
	}
	presetSection.appendChild(presetGrid);
	panel.appendChild(presetSection);

	var colorSection = el("div", "settings-section");
	colorSection.appendChild(el("div", "settings-section-title", "Цвета"));
	var colorVars = [
		["--bg-primary", "Фон"],
		["--bg-secondary", "Фон панели вкладок"],
		["--text-primary", "Текст"],
		["--text-secondary", "Второстепенный текст"],
		["--accent", "Акцент"],
		["--border", "Граница"],
		["--health-good", "Здоровье (норма)"],
		["--health-warn", "Здоровье (внимание)"],
		["--health-bad", "Здоровье (критическое)"]
	];
	var effective = getCurrentVarValues(themeState);
	for (var i = 0; i < colorVars.length; i++) {
		(function(varName, label) {
			var row = el("div", "settings-row");
			row.appendChild(el("span", "settings-label", label));
			var input = document.createElement("input");
			input.type = "color";
			input.className = "settings-color-input";
			input.value = normalizeToHex(effective[varName] || "#000000");
			input.oninput = function() {
				themeState.overrides[varName] = input.value;
				saveTheme(themeState);
				applyTheme(themeState);
			};
			row.appendChild(input);
			colorSection.appendChild(row);
		})(colorVars[i][0], colorVars[i][1]);
	}
	panel.appendChild(colorSection);

	var typoSection = el("div", "settings-section");
	typoSection.appendChild(el("div", "settings-section-title", "Типографика"));

	var fontRow = el("div", "settings-row");
	fontRow.appendChild(el("span", "settings-label", "Шрифт"));
	var fontInput = document.createElement("input");
	fontInput.type = "text";
	fontInput.className = "settings-input";
	fontInput.style.width = "180px";
	fontInput.placeholder = "По умолчанию";
	fontInput.value = themeState.fontFamily || "";
	fontInput.oninput = function() {
		themeState.fontFamily = fontInput.value;
		saveTheme(themeState);
		applyTheme(themeState);
	};
	fontRow.appendChild(fontInput);
	typoSection.appendChild(fontRow);

	var sizeRow = el("div", "settings-row");
	sizeRow.appendChild(el("span", "settings-label", "Размер шрифта"));
	var sizeInput = document.createElement("input");
	sizeInput.type = "number";
	sizeInput.className = "settings-input";
	sizeInput.style.width = "60px";
	sizeInput.min = "8";
	sizeInput.max = "24";
	sizeInput.value = themeState.fontSize || 12;
	sizeInput.oninput = function() {
		themeState.fontSize = parseInt(sizeInput.value) || 12;
		saveTheme(themeState);
		applyTheme(themeState);
	};
	sizeRow.appendChild(sizeInput);
	typoSection.appendChild(sizeRow);
	panel.appendChild(typoSection);

	var advSection = el("div", "settings-section");
	advSection.appendChild(el("div", "settings-section-title", "Дополнительно"));

	var radRow = el("div", "settings-row");
	radRow.appendChild(el("span", "settings-label", "Скругление углов"));
	var radSlider = document.createElement("input");
	radSlider.type = "range";
	radSlider.className = "settings-slider";
	radSlider.min = "0";
	radSlider.max = "12";
	radSlider.step = "1";
	radSlider.value = themeState.borderRadius != null ? themeState.borderRadius : 4;
	var radValue = el("span", "settings-slider-value", radSlider.value + "px");
	radSlider.oninput = function() {
		themeState.borderRadius = parseInt(radSlider.value);
		radValue.textContent = radSlider.value + "px";
		saveTheme(themeState);
		applyTheme(themeState);
	};
	radRow.appendChild(radSlider);
	radRow.appendChild(radValue);
	advSection.appendChild(radRow);

	var cssRow = el("div", "settings-row");
	cssRow.style.flexDirection = "column";
	cssRow.style.alignItems = "stretch";
	cssRow.appendChild(el("span", "settings-label", "Свой CSS"));
	var cssArea = document.createElement("textarea");
	cssArea.className = "settings-textarea";
	cssArea.placeholder = "/* Ваш CSS здесь */";
	cssArea.value = themeState.customCSS || "";
	cssArea.oninput = function() {
		themeState.customCSS = cssArea.value;
		saveTheme(themeState);
		applyTheme(themeState);
	};
	cssRow.appendChild(cssArea);
	advSection.appendChild(cssRow);
	panel.appendChild(advSection);

	var actions = el("div", "settings-actions");

	var resetBtn = el("button", "settings-action-btn", "Сброс");
	resetBtn.onclick = function() {
		var def = getDefaultThemeState();
		saveTheme(def);
		applyTheme(def);
		draw_settings();
	};
	actions.appendChild(resetBtn);

	var exportBtn = el("button", "settings-action-btn", "Экспорт");
	exportBtn.onclick = function() {
		var json = exportTheme(loadTheme());
		if (navigator.clipboard && navigator.clipboard.writeText) {
			navigator.clipboard.writeText(json).then(function() {
				exportBtn.textContent = "Скопировано!";
				setTimeout(function() { exportBtn.textContent = "Экспорт"; }, 1500);
			});
		} else {
			var ta = document.createElement("textarea");
			ta.value = json;
			document.body.appendChild(ta);
			ta.select();
			document.execCommand("copy");
			document.body.removeChild(ta);
			exportBtn.textContent = "Скопировано!";
			setTimeout(function() { exportBtn.textContent = "Экспорт"; }, 1500);
		}
	};
	actions.appendChild(exportBtn);

	var importBtn = el("button", "settings-action-btn", "Импорт");
	importBtn.onclick = function() {
		var json = prompt("Вставьте JSON темы:");
		if (json) {
			var imported = importTheme(json);
			if (imported) {
				saveTheme(imported);
				applyTheme(imported);
				draw_settings();
			} else {
				alert("Неверный формат JSON");
			}
		}
	};
	actions.appendChild(importBtn);
	panel.appendChild(actions);

	statcontent.appendChild(panel);
}

function restoreFocus() {
	var tag = document.activeElement && document.activeElement.tagName;
	if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;
	run_after_focus(function() {
		byond_winset({ "map.focus": "true" });
	});
}
document.addEventListener("mouseup", restoreFocus);
document.addEventListener("keyup", restoreFocus);

loadFavorites();

	addPermanentTab("Status");

}

	byond_winset({ command: "Panel-Ready" });

setTimeout(NotifyByondOnload, 500);
setTimeout(NotifyByondOnload, 1500);

function getCookie(cname) {
	var name = cname + "=";
	var ca = document.cookie.split(";");
	for (var i = 0; i < ca.length; i++) {
		var c = ca[i];
		while (c.charAt(0) === " ") c = c.substring(1);
		if (c.indexOf(name) === 0) return decodeURIComponent(c.substring(name.length, c.length));
	}
	return "";
}
