<!DOCTYPE html>
<html>
<head>
<title>Stat Browser</title>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<meta http-equiv="Cache-Control" content="max-age=15; must-revalidate" />
<style>
:root {
	--bg-primary: #202020;
	--bg-secondary: #1a1a1a;
	--bg-tertiary: #2a2a2a;
	--bg-hover: #333333;
	--text-primary: #abc6ec;
	--text-secondary: #8a9bb5;
	--text-muted: #556070;
	--accent: #dc143c;
	--accent-hover: #e8354f;
	--health-good: #4ec94e;
	--health-warn: #cca700;
	--health-bad: #f44747;
	--border: rgba(255, 255, 255, 0.08);
	--font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Verdana, sans-serif;
	--font-mono: Consolas, "Courier New", monospace;
	--fav-bg: rgba(232, 168, 32, 0.15);
	--fav-border: rgba(232, 168, 32, 0.5);
	--fav-accent: #e8a820;
	--font-size: 12px;
	--border-radius: 4px;
}

body.light {
	--bg-primary: #ffffff;
	--bg-secondary: #f3f3f3;
	--bg-tertiary: #e8e8e8;
	--bg-hover: #e0e0e0;
	--text-primary: #1e1e1e;
	--text-secondary: #555555;
	--text-muted: #999999;
	--border: #d4d4d4;
}

* { box-sizing: border-box; }

body {
	font-family: var(--font-sans);
	font-size: var(--font-size);
	margin: 0;
	padding: 0;
	overflow-x: hidden;
	overflow-y: auto;
	background-color: var(--bg-primary);
	color: var(--text-primary);
}

::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: var(--bg-primary); }
::-webkit-scrollbar-thumb { background: var(--bg-tertiary); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--bg-hover); }

a { color: var(--accent); text-decoration: none; cursor: pointer; }
a:hover { text-decoration: underline; }

img { image-rendering: pixelated; }

/* Focus rings — keyboard-only via :focus-visible so mouse interactions stay clean.
   Player session can be 4+ hours; without this, keyboard users have zero feedback.
   The inner rule uses `outline-color` only so per-component CSS can still tweak the look. */
:focus { outline: none; }
*:focus-visible {
	outline: 2px solid var(--accent);
	outline-offset: 1px;
}

/* Respect prefers-reduced-motion — disable shuttle pulse and slow transitions for users
   who've asked the OS to ease up on motion (vestibular triggers, low-power modes). */
@media (prefers-reduced-motion: reduce) {
	* {
		animation-duration: 0.01ms !important;
		animation-iteration-count: 1 !important;
		transition-duration: 0.01ms !important;
		scroll-behavior: auto !important;
	}
}

/* ===== Tab Bar ===== */
#tab-bar {
	display: flex;
	flex-wrap: wrap;
	align-items: stretch;
	background: var(--bg-secondary);
	border-bottom: 1px solid var(--border);
	position: fixed;
	top: 0;
	left: 0;
	right: 0;
	z-index: 100;
	padding: 0 2px;
	min-height: 32px;
}

#tab-bar-spacer {
	flex-grow: 1;
	order: 9997;
}

.tab-btn {
	display: inline-flex;
	align-items: center;
	padding: var(--tab-padding-v, 6px) var(--tab-padding-h, 12px);
	font-size: 12px;
	font-family: var(--font-sans);
	color: var(--text-secondary);
	background: transparent;
	border: none;
	border-bottom: 2px solid transparent;
	cursor: pointer;
	white-space: nowrap;
	flex-shrink: 0;
	transition: color 80ms, border-color 80ms, background 80ms;
	outline: none;
}
.tab-btn:hover {
	color: var(--text-primary);
	background: var(--bg-hover);
}
.tab-btn.active {
	color: var(--text-primary);
	border-bottom-color: var(--accent);
}
.tab-btn.tab-fav.active {
	border-bottom-color: var(--fav-accent);
}

#tab-search-btn {
	flex-shrink: 0;
	order: 9998;
	padding: var(--tab-padding-v, 6px) 8px;
	background: transparent;
	border: none;
	cursor: pointer;
	color: var(--text-secondary);
	display: inline-flex;
	align-items: center;
}
#tab-search-btn:hover { color: var(--text-primary); }
#tab-search-btn svg { width: 14px; height: 14px; }

/* ===== Content Area ===== */
#spacer { height: 34px; }
#statcontent { padding: 0; }

/* ===== Search Overlay ===== */
#global-search-overlay {
	display: none;
	position: fixed;
	top: 34px;
	left: 0;
	right: 0;
	bottom: 0;
	background: rgba(0, 0, 0, 0.92);
	z-index: 200;
}
#global-search-overlay.visible { display: flex; flex-direction: column; }
#global-search-box {
	margin: 12px 12px 0 12px;
	padding: 8px 12px;
	font-size: 13px;
	font-family: var(--font-sans);
	background: var(--bg-secondary);
	border: 1px solid var(--accent);
	border-radius: 6px;
	color: var(--text-primary);
	outline: none;
}
#global-search-results {
	flex: 1;
	overflow-y: auto;
	padding: 8px 12px;
}
.search-cat-header {
	font-size: 11px;
	font-weight: bold;
	color: var(--text-secondary);
	text-transform: uppercase;
	letter-spacing: 0.5px;
	padding: 8px 0 4px 0;
	border-bottom: 1px solid var(--border);
	margin-bottom: 4px;
}
.search-result-item {
	display: inline-block;
	padding: 4px 10px;
	margin: 2px;
	border-radius: 4px;
	background: var(--bg-tertiary);
	color: var(--text-primary);
	cursor: pointer;
	font-size: 12px;
}
.search-result-item:hover { background: var(--accent); color: #fff; text-decoration: none; }

/* ===== Section Headers ===== */
.section-header {
	display: flex;
	align-items: center;
	font-weight: 600;
	font-size: 11px;
	text-transform: uppercase;
	letter-spacing: 0.5px;
	padding: 6px 8px;
	color: var(--text-secondary);
	background: var(--bg-secondary);
	border-bottom: 1px solid var(--border);
	cursor: pointer;
	user-select: none;
}
.section-header:hover { background: var(--bg-tertiary); }
.section-arrow { margin-right: 6px; font-size: 9px; }

/* ===== Grid Layout ===== */
.metric-grid {
	display: grid;
	grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
}
.metric-item {
	padding: 4px 8px;
	border-bottom: 1px solid var(--border);
	min-width: 0;
	overflow: hidden;
}
.metric-label {
	font-size: 10px;
	font-weight: 600;
	color: var(--text-muted);
	text-transform: uppercase;
	letter-spacing: 0.3px;
	white-space: nowrap;
	overflow: hidden;
	text-overflow: ellipsis;
}
.metric-value {
	font-size: 13px;
	font-family: var(--font-mono);
	overflow: hidden;
	text-overflow: ellipsis;
	white-space: nowrap;
	color: var(--text-primary);
}
.metric-value a { font-weight: bold; }
.metric-wide { grid-column: 1 / -1; }

/* ===== Ping Bar ===== */
.ping-bar {
	display: flex;
	align-items: center;
	gap: 8px;
	padding: 5px 8px;
	font-size: 12px;
	font-family: var(--font-mono);
	background: var(--bg-secondary);
	border-bottom: 1px solid var(--border);
}
.ping-dot {
	width: 8px;
	height: 8px;
	border-radius: 50%;
	flex-shrink: 0;
}

/* ===== Shuttle Bar ===== */
.shuttle-bar {
	display: none;
	align-items: center;
	gap: 8px;
	padding: 6px 8px;
	font-weight: bold;
	font-size: 13px;
	border-bottom: 1px solid var(--border);
	position: relative;
	overflow: hidden;
}
.shuttle-icon { flex-shrink: 0; font-size: 14px; }
.shuttle-text { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.shuttle-timer { font-family: var(--font-mono); flex-shrink: 0; }

.shuttle-warn   { background: rgba(204, 167, 0, 0.15); color: var(--health-warn); }
.shuttle-danger { background: rgba(244, 71, 71, 0.15); color: var(--health-bad); }
.shuttle-safe   { background: rgba(78, 201, 78, 0.15); color: var(--health-good); }

.shuttle-progress {
	position: absolute;
	bottom: 0;
	left: 0;
	right: 0;
	height: 2px;
	background: rgba(255, 255, 255, 0.08);
}
.shuttle-progress-fill {
	height: 100%;
	width: 0%;
	transition: width 0.3s linear;
}
.shuttle-warn .shuttle-progress-fill   { background: var(--health-warn); }
.shuttle-danger .shuttle-progress-fill { background: var(--health-bad); }
.shuttle-safe .shuttle-progress-fill   { background: var(--health-good); }

@keyframes shuttle-pulse {
	0%, 100% { opacity: 1; }
	50% { opacity: 0.5; }
}
.shuttle-pulse { animation: shuttle-pulse 1.5s ease-in-out infinite; }

/* ===== Data Table ===== */
.data-table {
	width: 100%;
	border-collapse: collapse;
}
.data-table td {
	padding: 2px 6px;
	border-bottom: 1px solid var(--border);
	font-size: 12px;
}
.data-label {
	font-weight: bold;
	white-space: nowrap;
	width: 1%;
	color: var(--text-secondary);
	padding-right: 8px;
}
.data-value { font-family: var(--font-mono); }

/* ===== Ready Players (lobby) ===== */
.readyplayers-summary {
	font-weight: normal;
	font-size: 11px;
	color: var(--text-secondary);
	margin-left: 6px;
}
.readyplayers-table th {
	text-align: left;
	padding: 3px 8px;
	font-size: 11px;
	font-weight: bold;
	color: var(--text-secondary);
	border-bottom: 1px solid var(--border);
}
.readyplayers-table td {
	font-size: 12px;
	padding: 4px 8px;
	vertical-align: middle;
}
.readyplayers-col-num {
	width: 28px;
	text-align: right;
	color: var(--text-secondary);
}
.readyplayers-name {
	font-weight: bold;
	color: var(--text-primary);
}
.readyplayers-empty {
	padding: 12px 8px;
	font-size: 12px;
	color: var(--text-secondary);
}

/* ===== Vote Section ===== */
.vote-section {
	padding: 4px 8px;
	border-top: 1px solid var(--border);
}
.vote-header {
	font-weight: bold;
	font-size: 13px;
	padding: 4px 0;
	color: var(--text-secondary);
}
.vote-table {
	width: 100%;
	border-collapse: collapse;
}
.vote-table td { padding: 2px 4px; font-size: 12px; }

/* ===== Verb Grid ===== */
.verb-search {
	width: calc(100% - 16px);
	margin: 6px 8px;
	padding: 6px 10px;
	font-size: 12px;
	font-family: var(--font-sans);
	background: var(--bg-secondary);
	border: 1px solid var(--border);
	border-radius: 4px;
	color: var(--text-primary);
	outline: none;
}
.verb-search:focus { border-color: var(--accent); }

.verb-grid {
	display: inline-flex;
	flex-wrap: wrap;
	padding: 4px 6px;
	gap: 4px;
}
.verb-pill {
	display: inline-block;
	padding: var(--verb-padding-v, 5px) var(--verb-padding-h, 10px);
	background: var(--bg-tertiary);
	border: 1px solid var(--border);
	border-radius: 4px;
	color: var(--text-primary);
	font-size: 12px;
	cursor: pointer;
	text-decoration: none;
	transition: background 60ms;
	white-space: nowrap;
}
.verb-pill:hover { background: var(--bg-hover); text-decoration: none; }
.verb-pill.favorited {
	background: var(--fav-bg);
	border-color: var(--fav-border);
}
.verb-pill.favorited:hover {
	background: rgba(232, 168, 32, 0.25);
}
/* ===== Verb Links Style ===== */
body.verb-style-links .verb-pill {
	background: transparent;
	border: none;
	border-radius: 0;
	padding: 2px 4px;
	text-decoration: underline;
	color: var(--text-primary);
}
body.verb-style-links .verb-pill:hover {
	background: transparent;
	text-decoration: underline;
	color: var(--accent);
}
body.verb-style-links .verb-pill.favorited {
	background: transparent;
	border: none;
	color: var(--fav-accent);
}
body.verb-style-links .verb-pill.favorited:hover {
	background: transparent;
	color: var(--fav-accent);
}
body.verb-style-links .verb-grid {
	gap: 2px;
}

.verb-sub-header {
	width: 100%;
	font-size: 11px;
	font-weight: 600;
	color: var(--text-secondary);
	text-transform: uppercase;
	letter-spacing: 0.5px;
	padding: 8px 0 2px 4px;
	border-bottom: 1px solid var(--border);
	margin-bottom: 2px;
}
.fav-empty-msg {
	padding: 20px;
	text-align: center;
	color: var(--text-muted);
	font-size: 12px;
}

/* ===== MC Tab ===== */
.mc-container {
	padding: 0;
	--mc-seg-map: #5b8def;
	--mc-seg-mc: #b07be0;
	--mc-load-bar: rgba(176, 123, 224, 0.18);
}
body.light .mc-container { --mc-load-bar: rgba(120, 70, 190, 0.14); }

.mc-btn {
	padding: 3px 9px;
	border: 1px solid var(--border);
	border-radius: var(--border-radius);
	background: var(--bg-tertiary);
	color: var(--text-primary);
	cursor: pointer;
	font-size: 11px;
	font-family: var(--font-sans);
	white-space: nowrap;
}
.mc-btn:hover { background: var(--bg-hover); }
.mc-btn-danger { border-color: var(--health-bad); color: var(--health-bad); }
.mc-chip { border-radius: 10px; color: var(--text-secondary); }
.mc-chip-on { background: var(--accent); border-color: var(--accent); color: #fff; }
.mc-chip-on:hover { background: var(--accent-hover); }
.mc-actions {
	display: flex;
	flex-wrap: wrap;
	gap: 4px;
	padding: 6px 8px;
}

/* Summary tiles */
.mc-kpi-grid {
	display: grid;
	grid-template-columns: repeat(auto-fill, minmax(118px, 1fr));
	gap: 1px;
	background: var(--border);
	border-bottom: 1px solid var(--border);
}
.mc-kpi {
	position: relative;
	padding: 5px 8px 4px;
	background: var(--bg-primary);
	min-width: 0;
	overflow: hidden;
}
.mc-kpi-label {
	font-size: 10px;
	font-weight: 600;
	color: var(--text-muted);
	text-transform: uppercase;
	letter-spacing: 0.3px;
	white-space: nowrap;
	overflow: hidden;
	text-overflow: ellipsis;
}
.mc-kpi-value {
	font-size: 17px;
	font-weight: 600;
	font-family: var(--font-mono);
	line-height: 1.25;
	white-space: nowrap;
	overflow: hidden;
	text-overflow: ellipsis;
}
.mc-kpi-sub {
	font-size: 10px;
	color: var(--text-secondary);
	white-space: nowrap;
	overflow: hidden;
	text-overflow: ellipsis;
	min-height: 13px;
}
.mc-kpi-spark-box { height: 20px; margin-top: 2px; }
.mc-kpi-spark-box:empty { display: none; }
.mc-kpi-spark { display: block; width: 100%; height: 20px; margin: 0; }

/* Tick budget */
.mc-section-budget { padding: 6px 8px 4px; border-bottom: 1px solid var(--border); }
.mc-budget-bar {
	position: relative;
	display: flex;
	height: 14px;
	border-radius: 3px;
	overflow: hidden;
	background: var(--bg-tertiary);
}
.mc-seg { height: 100%; min-width: 1px; }
.mc-seg-map { background: var(--mc-seg-map); }
.mc-seg-mc { background: var(--mc-seg-mc); }
.mc-seg-reserve { background: var(--text-muted); }
.mc-seg-free { background: var(--bg-tertiary); }
.mc-budget-limit {
	position: absolute;
	top: 0;
	bottom: 0;
	width: 2px;
	margin-left: -1px;
	background: var(--health-warn);
}
.mc-budget-legend {
	display: flex;
	flex-wrap: wrap;
	gap: 2px 10px;
	margin-top: 4px;
	font-size: 11px;
	color: var(--text-secondary);
	font-family: var(--font-mono);
}
.mc-legend-item { white-space: nowrap; }
.mc-legend-dot {
	display: inline-block;
	width: 8px;
	height: 8px;
	margin-right: 4px;
	border-radius: 2px;
	vertical-align: 0;
}
.mc-legend-dot.mc-seg-free { border: 1px solid var(--text-muted); }
.mc-budget-info {
	margin-top: 3px;
	font-size: 11px;
	color: var(--text-muted);
}
.mc-top-list { margin-top: 6px; }
.mc-top-item {
	display: grid;
	grid-template-columns: minmax(70px, 30%) 1fr auto;
	align-items: center;
	gap: 6px;
	padding: 1px 0;
	font-size: 11px;
}
.mc-top-name {
	white-space: nowrap;
	overflow: hidden;
	text-overflow: ellipsis;
	font-weight: 600;
}
.mc-top-track {
	height: 6px;
	border-radius: 3px;
	background: var(--bg-tertiary);
	overflow: hidden;
}
.mc-top-fill { height: 100%; border-radius: 3px; background: currentColor; }
.mc-top-val { font-family: var(--font-mono); white-space: nowrap; }

.mc-controller-grid .metric-value a:not([class]) { color: var(--text-primary); }

/* Network */
.mc-net-table .data-label { text-align: left; }
.mc-net-table .data-value { font-family: var(--font-mono); font-size: 11px; }

/* Key and pinned cards */
.mc-key-section {
	display: grid;
	grid-template-columns: repeat(auto-fill, minmax(var(--mc-grid-min, 200px), 1fr));
	gap: 0;
}
body.mc-grid-fixed .mc-key-section {
	grid-template-columns: repeat(var(--mc-grid-cols, 2), 1fr);
}
.mc-key-card {
	padding: 4px 8px;
	border-bottom: 1px solid var(--border);
	border-right: 1px solid var(--border);
	min-width: 0;
}
.mc-key-pinned { box-shadow: inset 2px 0 0 var(--fav-accent); }
.mc-key-header {
	display: flex;
	align-items: baseline;
	gap: 8px;
	margin-bottom: 2px;
}
.mc-key-name { font-weight: bold; font-size: 13px; }
.mc-key-name a { font-weight: bold; }
.mc-key-stats {
	flex: 1;
	font-size: 11px;
	color: var(--text-secondary);
	font-family: var(--font-mono);
	white-space: nowrap;
}
.mc-key-table { border-collapse: collapse; margin: 2px 0 0 4px; }
.mc-key-dlabel {
	font-size: 11px;
	color: var(--text-secondary);
	padding: 0 10px 0 0;
	white-space: nowrap;
}
.mc-key-dval {
	font-size: 11px;
	font-family: var(--font-mono);
	color: var(--text-primary);
	padding: 0;
}
.mc-key-extra, .mc-detail-extra {
	font-size: 11px;
	font-family: var(--font-mono);
	color: var(--text-secondary);
	white-space: pre-wrap;
	word-break: break-word;
	margin: 2px 0 0 4px;
}
.mc-pin {
	cursor: pointer;
	color: var(--text-muted);
	font-size: 12px;
	user-select: none;
}
.mc-pin:hover { color: var(--fav-accent); }
.mc-pin-on { color: var(--fav-accent); }

/* Subsystem table */
.mc-toolbar {
	display: flex;
	flex-wrap: wrap;
	align-items: center;
	gap: 4px;
	padding: 4px 8px;
}
.mc-filter {
	flex: 1 1 140px;
	min-width: 100px;
	padding: 4px 8px;
	font-size: 12px;
	font-family: var(--font-sans);
	background: var(--bg-secondary);
	border: 1px solid var(--border);
	border-radius: var(--border-radius);
	color: var(--text-primary);
	outline: none;
}
.mc-filter:focus { border-color: var(--accent); }

.mc-ss-table {
	width: 100%;
	border-collapse: collapse;
	font-size: 12px;
	table-layout: fixed;
}
.mc-ss-table th {
	position: sticky;
	top: 0;
	z-index: 1;
	background: var(--bg-secondary);
	border-bottom: 2px solid var(--border);
	padding: 3px 4px;
	text-align: right;
	font-size: 11px;
	cursor: pointer;
	user-select: none;
	white-space: nowrap;
	overflow: hidden;
}
.mc-ss-table th:nth-child(1), .mc-ss-table th:nth-child(2) { text-align: left; }
.mc-th-sort:hover { background: var(--bg-tertiary); }
.mc-sorted { color: var(--accent); }
.mc-sorted::after { content: " \25B2"; font-size: 9px; }
.mc-sorted.desc::after { content: " \25BC"; }

.mc-ss-table th:nth-child(1), .mc-ss-table td:nth-child(1) { width: 18px; text-align: center; }
.mc-ss-table th:nth-child(3), .mc-ss-table td:nth-child(3) { width: 52px; }
.mc-ss-table th:nth-child(4), .mc-ss-table td:nth-child(4) { width: 44px; }
.mc-ss-table th:nth-child(5), .mc-ss-table td:nth-child(5) { width: 42px; }
.mc-ss-table th:nth-child(6), .mc-ss-table td:nth-child(6) { width: 40px; }
.mc-ss-table th:nth-child(7), .mc-ss-table td:nth-child(7) { width: 50px; }
.mc-ss-table th:nth-child(8), .mc-ss-table td:nth-child(8) { width: 54px; }

.mc-ss-table td {
	padding: 2px 4px;
	border-bottom: 1px solid var(--border);
	white-space: nowrap;
	overflow: hidden;
	text-overflow: ellipsis;
}
.mc-ss-row { cursor: pointer; }
.mc-ss-row:hover td { background-color: var(--bg-hover); }

// === src/tab-manager.js ===
function getTabOrder(name) {
	if (name === "Status") return 1;
	if (name === "MC") return 2;
	if (name === "Избранное") return 3;
	return 100 + name.charCodeAt(0);
}

function resolveTabDisplayName(name) {
	if (name.indexOf(".") !== -1) {
		var parts = name.split(".");
		if (State.splitAdminTabs && parts[0] === "Admin") return parts[1];
		return parts[0];
	}
	return name;
}

function createStatusTab(name) {
	var display = resolveTabDisplayName(name);
	if (display.trim() === "") return;
	if (document.getElementById("tab-" + display)) return;
	if (!State.verbTabs.includes(display) && !State.permanentTabs.includes(display)) return;

	var btn = el("button", "tab-btn");
	btn.id = "tab-" + display;
	btn.textContent = display;
	btn.style.order = getTabOrder(display);
	if (display === "Избранное") btn.classList.add("tab-fav");
	btn.onclick = function() {
		tab_change(display);
		this.blur();
	};

	var spacerEl = document.getElementById("tab-bar-spacer");
	if (spacerEl) {
		tabBar.insertBefore(btn, spacerEl);
	} else {
		tabBar.appendChild(btn);
	}
	SendTabToByond(display);
	spacer.style.height = tabBar.offsetHeight + "px";
}

function removeStatusTab(name) {
	var btn = document.getElementById("tab-" + name);
	if (!btn || State.permanentTabs.includes(name)) return;
	for (var i = State.verbTabs.length - 1; i >= 0; --i) {
		if (State.verbTabs[i] === name) State.verbTabs.splice(i, 1);
	}
	btn.parentNode.removeChild(btn);
	TakeTabFromByond(name);
	spacer.style.height = tabBar.offsetHeight + "px";
}

function addPermanentTab(name) {
	if (!State.permanentTabs.includes(name)) State.permanentTabs.push(name);
	createStatusTab(name);
}

function removePermanentTab(name) {
	for (var i = State.permanentTabs.length - 1; i >= 0; --i) {
		if (State.permanentTabs[i] === name) State.permanentTabs.splice(i, 1);
	}
	removeStatusTab(name);
}

function checkStatusTab() {
	var children = tabBar.children;
	for (var i = children.length - 1; i >= 0; i--) {
		var child = children[i];
		if (child.id === "tab-search-btn" || child.id === "tab-bar-spacer" || child.id === "settings-gear-btn") continue;
		var tabName = child.id.replace("tab-", "");
		if (!State.verbTabs.includes(tabName) && !State.permanentTabs.includes(tabName)) {
			tabBar.removeChild(child);
		}
	}
}

// Per-tab scroll memory. Players spend 4+ hour sessions in this panel; resetting scroll on
// every data tick or tab switch is the single most disruptive UX issue. We snapshot scrollTop
// before the switch and restore it after the new render flushes.
var _tabScrollPositions = {};

function tab_change(tab) {
	_settingsActive = false;
	if (tab === State.currentTab) return;
	if (State.currentTab && statcontent) {
		_tabScrollPositions[State.currentTab] = statcontent.scrollTop;
	}
	var oldBtn = document.getElementById("tab-" + State.currentTab);
	if (oldBtn) oldBtn.classList.remove("active");
	State.currentTab = tab;
	set_byond_tab(tab);
	var newBtn = document.getElementById("tab-" + tab);
	if (newBtn) newBtn.classList.add("active");
	closeGlobalSearch();
	invalidateRenderers();
	renderCurrentTab();
	byond_winset({ "statbrowser.is-visible": "true" });
	// Restore scroll after the renderer has populated the DOM.
	var restored = _tabScrollPositions[tab];
	if (restored != null && statcontent) {
		statcontent.scrollTop = restored;
	}
}

function set_byond_tab(tab) {
	send_byond_command("Set-Tab " + tab);
}

function SendTabsToByond() {
	var tabs = [].concat(State.permanentTabs, State.verbTabs);
	for (var i = 0; i < tabs.length; i++) SendTabToByond(tabs[i]);
}

function SendTabToByond(tab) {
	send_byond_command("Send-Tabs " + tab);
}

function TakeTabFromByond(tab) {
	send_byond_command("Remove-Tabs " + tab);
}

// elsewhere (zoom.js, future modules). ResizeObserver is preferred on browsers that have it.

function sortVerbs() {
	State.verbs.sort(function(a, b) {
		var sel = a[0] === b[0] ? 1 : 0;
		var av = a[sel].toUpperCase();
		var bv = b[sel].toUpperCase();
		if (av < bv) return 1;
		if (av > bv) return -1;
		return 0;
	});
}

function findVerbIndex(category, name, verblist) {
	var resolvedCategory = resolveTabDisplayName(category);
	for (var i = 0; i < verblist.length; i++) {
		if (resolveTabDisplayName(verblist[i][0]) === resolvedCategory && verblist[i][1] === name) return i;
	}
	return -1;
}

function remove_verb(v) {
	var resolvedCategory = resolveTabDisplayName(v[0]);
	for (var i = State.verbs.length - 1; i >= 0; i--) {
		if (resolveTabDisplayName(State.verbs[i][0]) === resolvedCategory && State.verbs[i][1] === v[1]) State.verbs.splice(i, 1);
	}
}

function check_verbs() {
	for (var v = State.verbTabs.length - 1; v >= 0; v--) {
		verbs_cat_check(State.verbTabs[v]);
	}
}

function verbs_cat_check(cat) {
	var tabCat = resolveTabDisplayName(cat);
	if (!State.verbTabs.includes(tabCat)) {
		removeStatusTab(tabCat);
		return;
	}
	var found = false;
	for (var v = 0; v < State.verbs.length; v++) {
		var verbcat = resolveTabDisplayName(State.verbs[v][0]);
		if (verbcat === tabCat && verbcat.trim() !== "") {
			found = true;
			break;
		}
	}
	if (!found) {
		removeStatusTab(tabCat);
		if (State.currentTab === tabCat) tab_change("Status");
	}
}

function wipe_verbs() {
	State.verbs = [];
	State.verbTabs = [];
	checkStatusTab();
}

function update_verbs() {
	wipe_verbs();
	send_byond_command("Update-Verbs");
}

function loadFavorites() {
	var stored = null;
	try { stored = serverStorage.getItem("statbrowser_favorites"); } catch (e) {}
	if (!stored) {
		try { stored = localStorage.getItem("statbrowser_favorites_cache"); } catch (e) {}
	}
	if (stored) {
		try { State.favorites = JSON.parse(stored); } catch (e) {}
	}
	updateFavoritesTab();
}

function saveFavorites() {
	var json = JSON.stringify(State.favorites);
	try { serverStorage.setItem("statbrowser_favorites", json); } catch (e) {}
	try { localStorage.setItem("statbrowser_favorites_cache", json); } catch (e) {}
}

function toggleFavorite(category, verbName) {
	var key = category + ":" + verbName;
	if (State.favorites[key]) {
		delete State.favorites[key];
	} else {
		State.favorites[key] = { cat: category, verb: verbName };
	}
	saveFavorites();
	updateFavoritesTab();
	if (State.currentTab === "Избранное" || State.verbTabs.includes(State.currentTab)) {
		renderCurrentTab();
	}
}

function isFavorite(category, verbName) {
	return !!State.favorites[category + ":" + verbName];
}

function hasFavorites() {
	for (var k in State.favorites) {
		if (State.favorites.hasOwnProperty(k)) return true;
	}
	return false;
}

function updateFavoritesTab() {
	if (hasFavorites()) {
		if (!State.permanentTabs.includes("Избранное")) {
			addPermanentTab("Избранное");
		}
	} else {
		if (State.permanentTabs.includes("Избранное")) {
			removePermanentTab("Избранное");
			if (State.currentTab === "Избранное") tab_change("Status");
		}
	}
}

function getPresetDefaults(presetKey) {
	var defaults = getDefaultThemeState();
	var preset = THEME_PRESETS[presetKey];
	if (preset && preset.settings) {
		for (var k in preset.settings) {
			defaults[k] = preset.settings[k];
		}
	}
	return defaults;
}

function checkPresetModified(themeState) {
	if (themeState.preset === "custom") return true;
	if (themeState.overrides && Object.keys(themeState.overrides).length > 0) return true;
	var presetDefaults = getPresetDefaults(themeState.preset);
	for (var i = 0; i < _SETTINGS_KEYS.length; i++) {
		var k = _SETTINGS_KEYS[i];
		if (themeState[k] !== presetDefaults[k]) return true;
	}
	return false;
}

function markCustomIfModified(themeState) {
	if (themeState.preset !== "custom" && checkPresetModified(themeState)) {
		themeState.basePreset = themeState.preset;
		themeState.preset = "custom";
	}
}

function loadTheme() {
	var defaults = getDefaultThemeState();
	var stored = null;
	try {
		stored = serverStorage.getItem(THEME_STORAGE_KEY);
	} catch (e) {}
	if (!stored) {
		try {
			stored = localStorage.getItem(THEME_LOCAL_CACHE_KEY);
		} catch (e) {}
	}
	if (stored) {
		try {
			var parsed = JSON.parse(stored);
			for (var k in defaults) {
				if (!(k in parsed)) parsed[k] = defaults[k];
			}
			return parsed;
		} catch (e) {}
	}
	return defaults;
}

function saveTheme(themeState) {
	var json = JSON.stringify(themeState);
	try { serverStorage.setItem(THEME_STORAGE_KEY, json); } catch (e) {}
	try { localStorage.setItem(THEME_LOCAL_CACHE_KEY, json); } catch (e) {}
}

function _resolvePreset(themeState) {
	var key = themeState.preset === "custom" ? (themeState.basePreset || "chat") : themeState.preset;

function buildSparkline(data, minVal, maxVal, colorClass) {
	var W = 80, H = 24;
	var ns = "http://www.w3.org/2000/svg";
	var svg = document.createElementNS(ns, "svg");
	svg.setAttribute("width", W);
	svg.setAttribute("height", H);
	svg.setAttribute("viewBox", "0 0 " + W + " " + H);
	svg.setAttribute("class", "sparkline");

	var dMin = Infinity, dMax = -Infinity;
	for (var i = 0; i < data.length; i++) {
		var v = parseFloat(data[i]) || 0;
		if (v < dMin) dMin = v;
		if (v > dMax) dMax = v;
	}
	var lo = Math.min(minVal, dMin);
	var hi = Math.max(maxVal, dMax);
	if (hi === lo) hi = lo + 1;

	var points = [];
	var step = W / Math.max(data.length - 1, 1);
	for (var i = 0; i < data.length; i++) {
		var v = parseFloat(data[i]) || 0;
		var x = Math.round(step * i * 10) / 10;
		var y = Math.round((H - 2) - ((v - lo) / (hi - lo)) * (H - 4) + 2);
		points.push(x + "," + y);
	}

	var polyline = document.createElementNS(ns, "polyline");
	polyline.setAttribute("points", points.join(" "));
	polyline.setAttribute("fill", "none");
	polyline.setAttribute("stroke-width", "1.5");
	polyline.setAttribute("stroke-linejoin", "round");

	var color = "var(--health-good)";
	if (colorClass && colorClass.indexOf("bad") !== -1) color = "var(--health-bad)";
	else if (colorClass && colorClass.indexOf("warn") !== -1) color = "var(--health-warn)";
	polyline.setAttribute("stroke", color);

	svg.appendChild(polyline);
	return svg;
}

	rp_els.tbody._lastHash = hash;
	rp_els.tbody.textContent = "";

	for (var i = 0; i < players.length; i++) {
		var tr = el("tr");
		tr.appendChild(el("td", "readyplayers-col-num", "" + (i + 1)));
		tr.appendChild(el("td", "readyplayers-name", players[i]));
		rp_els.tbody.appendChild(tr);
	}
}

// === src/renderers/mc.js ===
// MC tab: server health, tick budget, controller state, key subsystems and the subsystem table.
// Every section is built once and refreshed only when Master.iteration of the payload changes.

var MC_PREFS_KEY = "statbrowser_mc_prefs";
var MC_COLS = 8;

var mc = {
	root: null,
	els: {},
	rows: {},
	drawnIter: {},
	prefsLoaded: false
};

// ---------- Preferences ----------

function mc_loadPrefs() {
	if (mc.prefsLoaded) return;
	mc.prefsLoaded = true;
	var raw = null;
	try { raw = localStorage.getItem(MC_PREFS_KEY); } catch (e) {}
	if (!raw) return;
	try {
		var p = JSON.parse(raw);
		if (p.sections) {
			for (var k in State.mcSections) {
				if (typeof p.sections[k] === "boolean") State.mcSections[k] = p.sections[k];
			}
		}
		if (p.pinned && typeof p.pinned === "object") State.mcPinned = p.pinned;
		if (typeof p.sortCol === "number") State.mcSortCol = p.sortCol;
		if (typeof p.sortAsc === "boolean") State.mcSortAsc = p.sortAsc;
		State.mcHideIdle = !!p.hideIdle;
		State.mcHotOnly = !!p.hotOnly;
	} catch (e) {}
}

function mc_savePrefs() {
	var p = {
		sections: State.mcSections,
		pinned: State.mcPinned,
		sortCol: State.mcSortCol,
		sortAsc: State.mcSortAsc,
		hideIdle: State.mcHideIdle,
		hotOnly: State.mcHotOnly
	};
	try { localStorage.setItem(MC_PREFS_KEY, JSON.stringify(p)); } catch (e) {}
}

// ---------- Small helpers ----------

function mc_num(v, digits) {
	var n = parseFloat(v);
	if (isNaN(n)) return "-";
	return digits === undefined ? "" + n : n.toFixed(digits);
}

function mc_loadClass(pct) {
	if (pct >= 5) return "health-bad";
	if (pct >= 2) return "health-warn";
	return "health-good";
}

function mc_mapTickClass(pct) {
	if (pct >= 30) return "val-bad";
	if (pct >= 15) return "val-warn";
	return "val-good";
}

function mc_mcLoadClass(load, limit) {
	var share = load / Math.max(limit || 70, 1);
	if (share >= 0.9) return "val-bad";
	if (share >= 0.6) return "val-warn";
	return "val-good";
}

function mc_memClass(vsz, ceiling) {
	if (!ceiling) return "";
	var share = vsz / ceiling;
	if (share >= 0.9) return "val-bad";
	if (share >= 0.8) return "val-warn";
	return "val-good";
}

function mc_defconClass(defcon) {
	if (defcon === undefined || defcon === null) return "val-bad";
	if (defcon >= 5) return "val-good";
	if (defcon >= 3) return "val-warn";
	return "val-bad";
}

function mc_isHot(row) {
	return row[SS_CAN_FIRE] && ((row[SS_LOAD] || 0) >= 2 || (row[SS_COST] || 0) >= 3 || (row[SS_OVERRUN] || 0) >= 1);
}

function mc_link(text, ref, cls) {
	var a = el("a", cls, text);
	a.href = "#";
	a.onclick = function(e) {
		e.preventDefault();
		e.stopPropagation();
		if (ref) byond_topic(mcMakeVvLink(ref));
		return false;
	};
	return a;
}

function mc_button(text, title, onclick, cls) {
	var b = el("button", "mc-btn" + (cls ? " " + cls : ""), text);
	b.type = "button";
	if (title) b.title = title;
	b.onclick = function(e) {
		e.stopPropagation();
		onclick();
	};
	return b;
}

function mc_formatDs(ds) {
	if (ds === null || ds === undefined) return "-";
	var n = parseFloat(ds);
	if (isNaN(n)) return "-";
	var neg = n < 0;
	n = Math.abs(n);
	var out;
	if (n < 10) out = n.toFixed(1) + " дс";
	else if (n < 600) out = (n / 10).toFixed(n < 100 ? 1 : 0) + " с";
	else out = Math.floor(n / 600) + " мин " + Math.round((n % 600) / 10) + " с";
	return neg ? "-" + out : out;
}

function mc_flagNames(flags) {
	var out = [];
	for (var i = 0; i < SS_FLAG_NAMES.length; i++) {
		if (flags & SS_FLAG_NAMES[i][0]) out.push(SS_FLAG_NAMES[i][1]);
	}
	return out;
}

function mc_rowByName(name) {
	for (var i = 0; i < State.mcSSData.length; i++) {
		if (State.mcSSData[i][SS_NAME] === name) return State.mcSSData[i];
	}
	return null;
}

function mc_togglePin(name) {
	if (State.mcPinned[name]) delete State.mcPinned[name];
	else State.mcPinned[name] = true;
	mc_savePrefs();
	mc.drawnIter.key = null;
	mc_updateKeySection();
	var r = mc.rows[name];
	if (r) {
		mc_updatePinMark(r, name);
		if (r.detail) mc_fillDetail(r);
	}
}

function mc_updatePinMark(r, name) {
	var pinned = !!State.mcPinned[name];
	r.pin.textContent = pinned ? "★" : "☆";
	r.pin.className = "mc-pin" + (pinned ? " mc-pin-on" : "");
	r.pin.title = pinned ? "Открепить из «Ключевых»" : "Закрепить в «Ключевых»";
}

// Sections are a header plus a body; collapsing forgets the drawn iteration so reopening redraws.
function mc_section(key, label) {
	var header = makeSectionHeader(key, label, State.mcSections);
	var body = el("div", "mc-section-body mc-section-" + key);
	body.style.display = State.mcSections[key] ? "" : "none";
	header._toggle = function() {
		body.style.display = State.mcSections[key] ? "" : "none";
		mc.drawnIter[key] = null;
		mc_savePrefs();
		if (State.mcSections[key]) draw_mc();
	};
	mc.root.appendChild(header);
	mc.root.appendChild(body);
	return { header: header, body: body };
}

function mc_sparkline(series, minVal, maxVal, cls) {
	if (!series || series.length < 2) return null;
	var svg = buildSparkline(series, minVal, maxVal, cls);
	svg.setAttribute("preserveAspectRatio", "none");
	svg.setAttribute("class", "sparkline mc-kpi-spark");
	var line = svg.firstChild;
	if (line) line.setAttribute("vector-effect", "non-scaling-stroke");
	return svg;
}

// ---------- Skeleton ----------

function mc_ensureSkeleton() {
	if (mc.root && mc.root.parentNode === statcontent) return;
	mc_loadPrefs();
	statcontent.textContent = "";
	mc.rows = {};
	mc.drawnIter = {};
	mc.els = {};
	mc.root = el("div", "mc-container");

	var s = mc_section("summary", "Сводка");
	mc.els.kpi = el("div", "mc-kpi-grid");
	s.body.appendChild(mc.els.kpi);
	mc.els.kpiTiles = {};

	s = mc_section("budget", "Бюджет тика");
	mc.els.budget = s.body;

	s = mc_section("controller", "Контроллер");
	mc.els.controllerGrid = el("div", "metric-grid mc-controller-grid");
	mc.els.controllerActions = el("div", "mc-actions");
	s.body.appendChild(mc.els.controllerGrid);
	s.body.appendChild(mc.els.controllerActions);
	mc_buildControllerActions();

	s = mc_section("net", "Пинг и сеть");
	mc.els.net = el("table", "data-table mc-net-table");
	s.body.appendChild(mc.els.net);

	s = mc_section("key", "Ключевые и закреплённые");
	mc.els.key = el("div", "mc-key-section");
	s.body.appendChild(mc.els.key);

	s = mc_section("subsystems", "Подсистемы");
	mc.els.ssHeader = s.header;
	mc_buildSubsystemTable(s.body);

	statcontent.appendChild(mc.root);
}

function mc_buildControllerActions() {
	var box = mc.els.controllerActions;
	box.appendChild(mc_button("Master", "Открыть переменные Master", function() {
		byond_topic(mcMakeVvLink(State.mcServerData.ref_master));
	}));
	box.appendChild(mc_button("Failsafe", "Открыть переменные Failsafe", function() {
		if (State.mcServerData.ref_failsafe) byond_topic(mcMakeVvLink(State.mcServerData.ref_failsafe));
	}));
	box.appendChild(mc_button("GLOB", "Открыть глобальные переменные", function() {
		byond_topic(mcMakeVvLink(State.mcServerData.ref_glob));
	}));
	box.appendChild(mc_button("Config", "Открыть конфиг", function() {
		byond_topic(mcMakeVvLink(State.mcServerData.ref_config));
	}));
	box.appendChild(mc_button("Камеры", "Открыть переменные камерасети", function() {
		byond_topic(mcMakeVvLink(State.mcServerData.ref_cameranet));
	}));
	box.appendChild(mc_button("Debug Controller", "Выбрать контроллер и открыть его переменные", function() {
		send_byond_command("Debug-Controller");
	}));
	box.appendChild(mc_button("Restart Controller", "Перезапустить Master или Failsafe (спросит, какой)", function() {
		send_byond_command("Restart-Controller");
	}, "mc-btn-danger"));
}

function mc_buildSubsystemTable(body) {
	var bar = el("div", "mc-toolbar");
	mc.els.filterInput = el("input", "mc-filter");
	mc.els.filterInput.type = "text";
	mc.els.filterInput.placeholder = "Фильтр по имени...";
	mc.els.filterInput.value = State.mcFilterText;
	mc.els.filterInput.oninput = function() {
		State.mcFilterText = this.value.toLowerCase();
		mc_applyFilter();
	};
	bar.appendChild(mc.els.filterInput);

	mc.els.chipIdle = mc_button("Скрыть выключенные", "Не показывать подсистемы, которые не запускаются", function() {
		State.mcHideIdle = !State.mcHideIdle;
		mc_savePrefs();
		mc_syncChips();
		mc_applyFilter();
	}, "mc-chip");
	mc.els.chipHot = mc_button("Только нагруженные", "Нагрузка от 2% тика, проход от 3 мс или перерасход", function() {
		State.mcHotOnly = !State.mcHotOnly;
		mc_savePrefs();
		mc_syncChips();
		mc_applyFilter();
	}, "mc-chip");
	bar.appendChild(mc.els.chipIdle);
	bar.appendChild(mc.els.chipHot);
	body.appendChild(bar);
	mc_syncChips();

	var table = el("table", "mc-ss-table");
	var thead = el("thead");
	var hrow = el("tr");
	var cols = [
		{ label: "", col: SS_STATE, title: "Состояние: R работает, Q в очереди, P пауза, S спит в fire()" },
		{ label: "Имя", col: SS_NAME, title: "Имя подсистемы. Клик по строке - подробности" },
		{ label: "Нагр%", col: SS_LOAD, title: "Средняя доля каждого тика: цена прохода, размазанная по интервалу" },
		{ label: "мс", col: SS_COST, title: "Средняя цена прохода, мс" },
		{ label: "Тик%", col: SS_TICK, title: "Средняя цена прохода в % тика" },
		{ label: "Пер%", col: SS_OVERRUN, title: "Перерасход: % тика сверх выделенного без паузы" },
		{ label: "Инт.", col: SS_WAIT, title: "Интервал между запусками" },
		{ label: "#", col: SS_FIRED, title: "Сколько проходов завершено" }
	];
	for (var c = 0; c < cols.length; c++) {
		var th = el("th", "mc-th-sort", cols[c].label);
		th.title = cols[c].title;
		th.setAttribute("data-col", cols[c].col);
		th.onclick = function() {
			var col = parseInt(this.getAttribute("data-col"), 10);
			if (State.mcSortCol === col) {
				State.mcSortAsc = !State.mcSortAsc;
			} else {
				State.mcSortCol = col;
				State.mcSortAsc = (col === SS_NAME);
			}
			mc_savePrefs();
			mc_updateSortIndicators();
			mc_sortAndReorder();
		};
		hrow.appendChild(th);
	}
	thead.appendChild(hrow);
	table.appendChild(thead);
	mc.els.ssTable = table;
	mc.els.ssTbody = el("tbody");
	table.appendChild(mc.els.ssTbody);
	body.appendChild(table);
	mc_updateSortIndicators();
}

function mc_syncChips() {
	if (!mc.els.chipIdle) return;
	mc.els.chipIdle.className = "mc-btn mc-chip" + (State.mcHideIdle ? " mc-chip-on" : "");
	mc.els.chipHot.className = "mc-btn mc-chip" + (State.mcHotOnly ? " mc-chip-on" : "");
}

// ---------- Summary ----------

function mc_kpiTile(key, label) {
	var t = mc.els.kpiTiles[key];
	if (t) return t;
	t = {};
	t.root = el("div", "mc-kpi");
	t.label = el("div", "mc-kpi-label", label);
	t.value = el("div", "mc-kpi-value");
	t.sub = el("div", "mc-kpi-sub");
	t.spark = el("div", "mc-kpi-spark-box");
	t.root.appendChild(t.label);
	t.root.appendChild(t.value);
	t.root.appendChild(t.sub);
	t.root.appendChild(t.spark);
	mc.els.kpi.appendChild(t.root);
	mc.els.kpiTiles[key] = t;
	return t;
}

function mc_setKpi(key, label, value, cls, sub, series, lo, hi, title) {
	var t = mc_kpiTile(key, label);
	setText(t.value, value);
	t.value.className = "mc-kpi-value " + (cls || "");
	setText(t.sub, sub || "");
	t.root.title = title || "";
	t.spark.textContent = "";
	var svg = mc_sparkline(series, lo, hi, cls);
	if (svg) t.spark.appendChild(svg);
}

function mc_updateSummary() {
	if (!State.mcSections.summary || mc.drawnIter.summary === State.mcIteration) return;
	mc.drawnIter.summary = State.mcIteration;
	var d = State.mcServerData;
	var h = d.history || {};

	mc_setKpi("tidi", "TimeDilation", mc_num(d.tidi_current, 1) + "%", mcTidiClass(d.tidi_current),
		mc_num(d.tidi_avg_fast, 1) + " / " + mc_num(d.tidi_avg, 1) + " / " + mc_num(d.tidi_avg_slow, 1),
		h.tidi, 0, 20, "Замедление времени сейчас; под ним средние: быстрое / обычное / медленное");
	mc_setKpi("cpu", "CPU", mc_num(d.cpu, 0) + "%", mcCpuClass(d.cpu), "world.cpu",
		h.cpu, 0, 100, "Занятость тика по мнению BYOND");
	mc_setKpi("maptick", "SendMaps", mc_num(d.maptick, 1) + "%", mc_mapTickClass(d.maptick), "отправка карты клиентам",
		h.maptick, 0, 30, "world.map_cpu: доля тика, которую BYOND тратит на рассылку карты. Её вычитают из лимита МК");
	mc_setKpi("mc", "Нагрузка МК", mc_num(d.mc_load, 1) + "%", mc_mcLoadClass(d.mc_load, d.tick_limit_running),
		"из " + mc_num(d.tick_limit_running, 0) + "% лимита",
		h.mc, 0, 50, "Сумма средней доли тика по всем активным подсистемам (оценка по их средним)");
	mc_setKpi("ping", "Пинг (медиана)", mc_num(d.ping_rtt_median, 0) + " мс", pingClass(d.ping_rtt_median),
		"ср. " + mc_num(d.ping_rtt_avg, 0) + " / макс " + mc_num(d.ping_rtt_max, 0),
		h.ping, 0, 150, "Медиана RTT по всем клиентам; среднее тянет вверх один клиент с плохим каналом");
	mc_setKpi("players", "Игроки", "" + (d.players || 0), "",
		d.round_time ? "раунд " + d.round_time : "раунд не начат", null, 0, 0, "");
	if (d.mem_vsz) {
		var memSub = d.mem_ceiling ? "из " + d.mem_ceiling + " МБ" : "потолок неизвестен";
		memSub += ", " + (d.mem_growth >= 0 ? "+" : "") + mc_num(d.mem_growth, 1) + " МБ/мин";
		mc_setKpi("mem", "Память", d.mem_vsz + " МБ", mc_memClass(d.mem_vsz, d.mem_ceiling), memSub, null, 0, 0,
			"Адресное пространство процесса (VmSize) и скорость роста");
	}
	mc_setKpi("coords", "Камера", d.coords || "-", "", d.instances + " объектов в мире", null, 0, 0, "Координаты взгляда (X, Y, Z)");
}

// ---------- Tick budget ----------

function mc_updateBudget() {
	if (!State.mcSections.budget || mc.drawnIter.budget === State.mcIteration) return;
	mc.drawnIter.budget = State.mcIteration;
	var d = State.mcServerData;
	var body = mc.els.budget;
	body.textContent = "";

	var maptick = Math.max(0, parseFloat(d.maptick) || 0);
	var mcLoad = Math.max(0, parseFloat(d.mc_load) || 0);
	var reserve = Math.max(0, parseFloat(d.tick_byond_reserve) || 0);
	var segs = [
		{ cls: "mc-seg-map", label: "SendMaps", value: maptick },
		{ cls: "mc-seg-mc", label: "МК", value: mcLoad },
		{ cls: "mc-seg-reserve", label: "Резерв BYOND", value: reserve }
	];
	var used = 0;
	for (var i = 0; i < segs.length; i++) used += segs[i].value;
	segs.push({ cls: "mc-seg-free", label: "Свободно", value: Math.max(0, 100 - used) });

	var bar = el("div", "mc-budget-bar");
	var scale = Math.max(100, used);
	var legend = el("div", "mc-budget-legend");
	for (var j = 0; j < segs.length; j++) {
		var w = segs[j].value / scale * 100;
		if (w > 0) {
			var seg = el("div", "mc-seg " + segs[j].cls);
			seg.style.width = w + "%";
			seg.title = segs[j].label + ": " + segs[j].value.toFixed(1) + "% тика";
			bar.appendChild(seg);
		}
		var li = el("span", "mc-legend-item");
		li.appendChild(el("span", "mc-legend-dot " + segs[j].cls));
		li.appendChild(document.createTextNode(segs[j].label + " " + segs[j].value.toFixed(1) + "%"));
		legend.appendChild(li);
	}
	var limit = parseFloat(d.tick_limit_running);
	if (limit > 0) {
		var mark = el("div", "mc-budget-limit");
		mark.style.left = Math.min(100, (maptick + limit) / scale * 100) + "%";
		mark.title = "Лимит МК: " + limit.toFixed(0) + "% тика после SendMaps";
		bar.appendChild(mark);
	}
	body.appendChild(bar);
	body.appendChild(legend);

	var info = el("div", "mc-budget-info");
	var parts = [
		"Лимит МК " + mc_num(d.mc_tick_limit, 1) + "%",
		"вне МК " + (d.outside_tick_limit ? d.outside_tick_limit + "%" : "без бюджета"),
		"фон " + (d.background_tick_budget ? d.background_tick_budget + "%" : "без потолка"),
		"растягивание " + (d.pace_passes ? "вкл" : "выкл")
	];
	info.textContent = parts.join(" · ");
	body.appendChild(info);

	// Top consumers by per-tick load
	var top = [];
	for (var k = 0; k < State.mcSSData.length; k++) {
		var row = State.mcSSData[k];
		if (row[SS_CAN_FIRE] && row[SS_LOAD] > 0) top.push(row);
	}
	top.sort(function(a, b) { return b[SS_LOAD] - a[SS_LOAD]; });
	top = top.slice(0, 6);
	if (!top.length) return;
	var maxLoad = top[0][SS_LOAD] || 1;
	var list = el("div", "mc-top-list");
	for (var t = 0; t < top.length; t++) {
		var r = top[t];
		var item = el("div", "mc-top-item");
		item.appendChild(mc_link(r[SS_NAME], r[SS_REF], "mc-top-name"));
		var track = el("div", "mc-top-track");
		var fill = el("div", "mc-top-fill " + mc_loadClass(r[SS_LOAD]));
		fill.style.width = Math.max(2, r[SS_LOAD] / maxLoad * 100) + "%";
		track.appendChild(fill);
		item.appendChild(track);
		item.appendChild(el("span", "mc-top-val " + mc_loadClass(r[SS_LOAD]),
			mc_num(r[SS_LOAD], 2) + "% · " + mc_num(r[SS_COST], 1) + " мс"));
		list.appendChild(item);
	}
	body.appendChild(list);
}

// ---------- Controller ----------

function mc_updateController() {

	mc.drawnIter.controller = State.mcIteration;
	var d = State.mcServerData;

	g.appendChild(makeGridItem("Очередь", d.mc_queue + (d.mc_skip_ticks ? " · пропуск " + d.mc_skip_ticks : ""), false));

		d.tick_drift_pct >= 5 ? "val-warn" : ""));

function mc_updateKeySection() {

function mc_buildKeyCard(name, row, details) {
	var card = el("div", "mc-key-card" + (State.mcPinned[name] ? " mc-key-pinned" : ""));
	var header = el("div", "mc-key-header");

// ---------- Subsystem table ----------

function mc_matchesFilter(row) {
	if (State.mcHideIdle && !row[SS_CAN_FIRE]) return false;
	if (State.mcHotOnly && !mc_isHot(row)) return false;
	if (!State.mcFilterText) return true;
	return row[SS_NAME].toLowerCase().indexOf(State.mcFilterText) !== -1;
}

function mc_applyFilter() {
	var shown = 0;
	for (var name in mc.rows) {
		var r = mc.rows[name];
		var visible = mc_matchesFilter(r.data);
		if (visible) shown++;
		r.tr.style.display = visible ? "" : "none";
		if (r.detail) r.detail.style.display = visible ? "" : "none";
	}
	mc_updateSSHeader(shown);
}

function mc_updateSSHeader(shown) {
	if (!mc.els.ssHeader) return;
	var total = State.mcSSData.length;
	var active = 0;
	for (var i = 0; i < total; i++) if (State.mcSSData[i][SS_CAN_FIRE]) active++;
	var label = " Подсистемы: " + active + " активных из " + total;
	if (shown !== undefined && shown !== total) label += ", показано " + shown;
	if (mc.els.ssHeader._countText.textContent !== label) mc.els.ssHeader._countText.textContent = label;
}

function mc_compare(a, b) {
	if (a[SS_CAN_FIRE] !== b[SS_CAN_FIRE]) return b[SS_CAN_FIRE] - a[SS_CAN_FIRE];
	var col = State.mcSortCol;
	var asc = State.mcSortAsc;
	if (col === SS_NAME) {
		var av = ("" + a[col]).toLowerCase();
		var bv = ("" + b[col]).toLowerCase();
		var cmp = av < bv ? -1 : av > bv ? 1 : 0;
		return asc ? cmp : -cmp;
	}
	var an = parseFloat(a[col]) || 0;
	var bn = parseFloat(b[col]) || 0;
	if (an === bn) return a[SS_NAME] < b[SS_NAME] ? -1 : 1;
	return asc ? an - bn : bn - an;
}

function mc_sortAndReorder() {
	var list = [];
	for (var name in mc.rows) list.push(mc.rows[name]);
	list.sort(function(x, y) { return mc_compare(x.data, y.data); });
	var tbody = mc.els.ssTbody;
	var idx = 0;
	for (var i = 0; i < list.length; i++) {
		var nodes = list[i].detail ? [list[i].tr, list[i].detail] : [list[i].tr];
		for (var j = 0; j < nodes.length; j++) {
			if (tbody.childNodes[idx] !== nodes[j]) tbody.insertBefore(nodes[j], tbody.childNodes[idx] || null);
			idx++;
		}
	}
}

function mc_updateSortIndicators() {
	if (!mc.els.ssTable) return;
	var ths = mc.els.ssTable.getElementsByTagName("th");
	for (var i = 0; i < ths.length; i++) {
		var col = parseInt(ths[i].getAttribute("data-col"), 10);
		ths[i].className = col === State.mcSortCol
			? "mc-th-sort mc-sorted" + (State.mcSortAsc ? "" : " desc")
			: "mc-th-sort";
	}
}

function mc_makeRow(name) {
	var r = { tr: el("tr", "mc-ss-row"), cells: [], detail: null, data: null };
	for (var c = 0; c < MC_COLS; c++) {
		var td = el("td");
		r.tr.appendChild(td);
		r.cells.push(td);
	}
	r.pin = el("span", "mc-pin");
	r.pin.onclick = function(e) { e.stopPropagation(); mc_togglePin(name); };
	r.link = mc_link(name, null);
	r.link.onclick = function(e) {
		e.preventDefault();
		e.stopPropagation();
		if (r.data) byond_topic(mcMakeVvLink(r.data[SS_REF]));
		return false;
	};
	r.link.title = "Открыть переменные";
	r.cells[1].appendChild(r.pin);
	r.cells[1].appendChild(r.link);
	r.tr.onclick = function() {
		if (State.mcExpanded[name]) delete State.mcExpanded[name];
		else State.mcExpanded[name] = true;
		mc_syncDetail(r, name);
		mc_sortAndReorder();
	};
	mc_updatePinMark(r, name);
	return r;
}

function mc_syncDetail(r, name) {
	if (State.mcExpanded[name]) {
		if (!r.detail) {
			r.detail = el("tr", "mc-detail-row");
			r.detailCell = el("td");
			r.detailCell.colSpan = MC_COLS;
			r.detail.appendChild(r.detailCell);
		}
		r.tr.className = "mc-ss-row mc-expanded";
		mc_fillDetail(r);
	} else {
		if (r.detail && r.detail.parentNode) r.detail.parentNode.removeChild(r.detail);
		r.detail = null;
		r.tr.className = "mc-ss-row";
	}
}

function mc_fillDetail(r) {
	var row = r.data;
	var cell = r.detailCell;

	if (row[SS_PAUSED_TICKS]) item("Пауз в проходе", "" + row[SS_PAUSED_TICKS], "health-warn");

	}));

	actions.appendChild(mc_button(State.mcPinned[name] ? "Открепить" : "Закрепить",
		"Показывать карточку в «Ключевых»", function() { mc_togglePin(name); }));
	cell.appendChild(actions);
}

function mc_updateSSRows() {
	if (!State.mcSections.subsystems) { mc_updateSSHeader(); return; }
	if (mc.drawnIter.subsystems === State.mcIteration) return;
	mc.drawnIter.subsystems = State.mcIteration;
	var seen = {};
	var maxLoad = 0;
	for (var m = 0; m < State.mcSSData.length; m++) {
		if (State.mcSSData[m][SS_CAN_FIRE] && State.mcSSData[m][SS_LOAD] > maxLoad) maxLoad = State.mcSSData[m][SS_LOAD];
	}
	for (var i = 0; i < State.mcSSData.length; i++) {
		var row = State.mcSSData[i];
		var name = row[SS_NAME];
		seen[name] = true;
		var r = mc.rows[name];
		if (!r) {
			r = mc_makeRow(name);
			mc.rows[name] = r;
			mc.els.ssTbody.appendChild(r.tr);
		}
		r.data = row;
		var cells = r.cells;
		var active = row[SS_CAN_FIRE];

		setText(cells[0], STATE_LETTERS[row[SS_STATE]] || "?");
		cells[0].className = "mc-state mc-state-" + row[SS_STATE];
		cells[0].title = STATE_NAMES[row[SS_STATE]] || "";

		var dname = row[SS_IS_BG] ? name + " [BG]" : name;
		if (r.link.textContent !== dname) r.link.textContent = dname;
		cells[1].className = "mc-name" + (!active ? " mc-offline" : (row[SS_IS_BG] ? " mc-bg" : ""));
		cells[1].title = row[SS_EXTRA] || "";

		if (!active) {
			for (var c = 2; c < 6; c++) { setText(cells[c], "-"); cells[c].className = "mc-num"; }
			cells[2].style.background = "";
		} else {
			var load = row[SS_LOAD] || 0;
			setText(cells[2], mc_num(load, 2));
			cells[2].className = "mc-num mc-load " + mc_loadClass(load);
			var w = maxLoad > 0 ? Math.round(load / maxLoad * 100) : 0;
			cells[2].style.background = w > 0
				? "linear-gradient(to left, var(--mc-load-bar) " + w + "%, transparent " + w + "%)"
				: "";
			setText(cells[3], mc_num(row[SS_COST], 1));
			cells[3].className = "mc-num " + mcHealthCost(row[SS_COST]);
			setText(cells[4], mc_num(row[SS_TICK], 1));
			cells[4].className = "mc-num " + mcHealthTick(row[SS_TICK]);
			setText(cells[5], mc_num(row[SS_OVERRUN], 1));
			cells[5].className = "mc-num " + mcHealthOverrun(row[SS_OVERRUN]);
		}
		setText(cells[6], mc_formatDs(row[SS_WAIT]));
		cells[6].className = "mc-num mc-wait";
		setText(cells[7], row[SS_FIRED]);
		cells[7].className = "mc-num";

		if (State.mcExpanded[name]) mc_syncDetail(r, name);
	}
	for (var n in mc.rows) {
		if (seen[n]) continue;
		var dead = mc.rows[n];
		if (dead.tr.parentNode) dead.tr.parentNode.removeChild(dead.tr);
		if (dead.detail && dead.detail.parentNode) dead.detail.parentNode.removeChild(dead.detail);
		delete mc.rows[n];
	}
	mc_sortAndReorder();
	mc_applyFilter();
}

// === src/renderers/verbs.js ===
var verbSearchTimers = {};
// Per-tab last query, so re-render after data change can repopulate without losing user's filter.
var verbLastQuery = {};

function draw_verbs(cat) {
	statcontent.textContent = "";

	var searchInput = el("input", "verb-search");
	searchInput.type = "text";
	searchInput.placeholder = "Поиск команд...";
	searchInput.autocomplete = "off";
	if (verbLastQuery[cat]) searchInput.value = verbLastQuery[cat];
	statcontent.appendChild(searchInput);

	var container = el("div");
	statcontent.appendChild(container);
	sortVerbs();

	// Map of pill -> the query strings it matches. Built once per draw, then filtered by toggling
	// display:none. This avoids thrashing the entire DOM on every keystroke for admins with 200+
	// verbs, and preserves focus/selection in the search input.
	var pillIndex = [];

	function buildVerbDOM() {
		container.textContent = "";
		pillIndex = [];
		var grid = el("div", "verb-grid");
		var additions = {};
		var subHeaders = {};

		var resolvedCat = cat;
		if (State.splitAdminTabs && cat.lastIndexOf(".") !== -1) {
			var sp = cat.split(".");
			if (sp[0] === "Admin") resolvedCat = sp[1];
		}

		var reversed = State.verbs.slice().reverse();
		for (var i = 0; i < reversed.length; i++) {
			var part = reversed[i];
			var verbCat = part[0];
			if (State.splitAdminTabs && verbCat.lastIndexOf(".") !== -1) {
				var sp2 = verbCat.split(".");
				if (sp2[0] === "Admin") verbCat = sp2[1];
			}
			var command = part[1];
			if (!command) continue;
			if (verbCat.lastIndexOf(resolvedCat, 0) !== 0) continue;
			if (verbCat.length !== resolvedCat.length && verbCat.charAt(resolvedCat.length) !== ".") continue;

			var subCat = verbCat.lastIndexOf(".") !== -1 ? verbCat.split(".")[1] : null;
			if (subCat && !additions[subCat]) {
				additions[subCat] = el("div", "verb-grid");
			}

			var pill = el("a", "verb-pill");
			pill.href = "#";
			if (isFavorite(part[0], command)) pill.classList.add("favorited");
			pill.textContent = command;
			pill.onclick = makeVerbOnclick(command);
			pill.oncontextmenu = (function(verbCatOrig, cmd) {
				return function(e) {
					e.preventDefault();
					toggleFavorite(verbCatOrig, cmd);
				};
			})(part[0], command);

			pillIndex.push({ el: pill, sub: subCat, search: command.toLowerCase() });
			(subCat ? additions[subCat] : grid).appendChild(pill);
		}

		container.appendChild(grid);

		for (var subKey in additions) {
			if (additions.hasOwnProperty(subKey)) {
				var hdr = el("div", "verb-sub-header", subKey);
				container.appendChild(hdr);
				container.appendChild(additions[subKey]);
				subHeaders[subKey] = { hdr: hdr, grid: additions[subKey] };
			}
		}
		return subHeaders;
	}

	var subHeaders = buildVerbDOM();

	function applyFilter(query) {
		// Toggle visibility instead of re-rendering. Hide whole sub-header sections when empty.
		var subVisibleCount = {};
		for (var i = 0; i < pillIndex.length; i++) {
			var entry = pillIndex[i];
			var matches = !query || entry.search.indexOf(query) !== -1;
			entry.el.style.display = matches ? "" : "none";
			if (entry.sub && matches) {
				subVisibleCount[entry.sub] = (subVisibleCount[entry.sub] | 0) + 1;
			}
		}
		for (var subKey in subHeaders) {
			if (!subHeaders.hasOwnProperty(subKey)) continue;
			var visible = subVisibleCount[subKey] || 0;
			subHeaders[subKey].hdr.style.display = visible ? "" : "none";
			subHeaders[subKey].grid.style.display = visible ? "" : "none";
		}
	}

	if (verbLastQuery[cat]) applyFilter(verbLastQuery[cat]);

	searchInput.oninput = function() {
		var val = this.value.toLowerCase();
		verbLastQuery[cat] = val;
		clearTimeout(verbSearchTimers[cat]);
		verbSearchTimers[cat] = setTimeout(function() { applyFilter(val); }, 60);
	};
}

function makeVerbOnclick(command) {
	return function(e) {
		e.preventDefault();
		run_after_focus(function() {
			send_byond_command(command.replace(/\s/g, "-"));
		});
	};
}

function favoriteCategoryLabel(cat) {
	var dot = cat.indexOf(".");
	if (dot === -1) return cat;
	return cat.substring(0, dot) + " \u2014 " + cat.substring(dot + 1);
}

function draw_favorites() {
	statcontent.textContent = "";

	if (!hasFavorites()) {
		var msg = el("div", "fav-empty-msg", "ПКМ по любой команде чтобы добавить в избранное");
		statcontent.appendChild(msg);
		return;
	}

	var byCategory = {};

	for (var key in State.favorites) {
		if (!State.favorites.hasOwnProperty(key)) continue;
		var fav = State.favorites[key];
		var displayCat = favoriteCategoryLabel(fav.cat);
		if (!byCategory[displayCat]) byCategory[displayCat] = [];
		byCategory[displayCat].push(fav);
	}

	for (var cat in byCategory) {
		if (!byCategory.hasOwnProperty(cat)) continue;
		var header = el("div", "verb-sub-header", cat);
		statcontent.appendChild(header);

		var catGrid = el("div", "verb-grid");
		var favs = byCategory[cat];
		for (var i = 0; i < favs.length; i++) {
			var fav = favs[i];
			var pill = el("a", "verb-pill favorited");
			pill.href = "#";
			pill.textContent = fav.verb;
			pill.onclick = makeVerbOnclick(fav.verb);
			pill.oncontextmenu = (function(c, v) {
				return function(e) {
					e.preventDefault();
					toggleFavorite(c, v);
				};
			})(fav.cat, fav.verb);
			catGrid.appendChild(pill);
		}
		statcontent.appendChild(catGrid);
	}
}

// AHELP_* enum constants must match code/__DEFINES/admin.dm
var AHELP_ACTIVE = 1, AHELP_CLOSED = 2, AHELP_RESOLVED = 3;

function ticketMakeTopic(ref, action) {
	return "?_src_=holder;admin_token=" + State.hrefToken + ";ahelp=" + encodeURIComponent(ref) + ";ahelp_action=" + action;
}

function ticketAgeText(seconds) {
	if (seconds == null || seconds < 0) return "";
	if (seconds < 60) return seconds + "с";
	var m = Math.floor(seconds / 60);
	var s = seconds % 60;
	if (m < 60) return m + "м " + s + "с";
	var h = Math.floor(m / 60);
	m = m % 60;
	return h + "ч " + m + "м";
}

function ticketAgeClass(seconds) {
	if (seconds == null) return "";
	if (seconds >= 600) return "val-bad";   // 10+ min — really stale
	if (seconds >= 180) return "val-warn";  // 3+ min — getting stale
	return "val-good";
}

function ticketStateInfo(meta) {
	var state = meta && meta.state;
	if (state === AHELP_ACTIVE) return { text: meta && meta.handler ? "В работе" : "Открыт", color: meta && meta.handler ? "var(--health-warn)" : "var(--health-good)", isClosed: false };
	if (state === AHELP_CLOSED) return { text: "Закрыт", color: "var(--text-muted)", isClosed: true };
	if (state === AHELP_RESOLVED) return { text: "Решён", color: "var(--text-muted)", isClosed: true };
	return { text: "", color: "var(--text-muted)", isClosed: false };
}

// Server-side hrefs accept the standard ahelp_action protocol; surfacing them here saves
// admins a round-trip into the chat window for the most common triage actions.
var TICKET_ACTIONS = [
	{ key: "reply",        label: "OTBET",  title: "Reply",   className: "" },
	{ key: "handle_issue", label: "HANDLE", title: "Handle",  className: "" },
	{ key: "close",        label: "CLOSE",  title: "Close",   className: "ticket-act-warn" },
	{ key: "resolve",      label: "RSLVE",  title: "Resolve", className: "ticket-act-good" },

// Per-ticket expand state, keyed by stable identifier (id/ref). Survives redraws so admins
// don't lose their place when DM pushes a tickets update. Stale keys are pruned on each draw.
var _ticketExpanded = {};

function _ticketKey(part) {
	var meta = part[3];
	if (meta && meta.id != null) return "id:" + meta.id;
	if (part[2]) return "ref:" + part[2];
	return null;
}

function _isTicketExpanded(part, isClosed) {
	var key = _ticketKey(part);
	if (key != null && Object.prototype.hasOwnProperty.call(_ticketExpanded, key)) {

	return !isClosed;

function _pruneExpandedState(seenKeys) {
	for (var k in _ticketExpanded) {

function draw_tickets() {
	// Preserve scroll position across redraws (toggle clicks, DM pushes).
	// Scroll happens on body/documentElement in this iframe, not on #statcontent.
	var scroller = document.scrollingElement || document.documentElement || document.body;
	var savedScroll = scroller ? scroller.scrollTop : 0;
	statcontent.textContent = "";

	var open = 0, inProgress = 0, closed = 0;

	var closedRows = [];

	if (State.tickets && State.tickets.length) {
		for (var i = 0; i < State.tickets.length; i++) {

			var key = _ticketKey(t);
			if (key) seenKeys[key] = true;
			if (meta && meta.state != null) {
				if (meta.state === AHELP_ACTIVE) {
					if (meta.handler) inProgress++; else open++;
					activeRows.push(t);

			var labelText = ("" + (t[0] || "")).toLowerCase();

				headerRows.push(t);
			} else if (labelText.indexOf("close") !== -1 || labelText.indexOf("resolve") !== -1 || labelText.indexOf("закр") !== -1) {
				closed++;

	if (!State.tickets || !State.tickets.length) {

var pixelRatio = window.devicePixelRatio || 1;
var statbrowserBaseZoom = pixelRatio !== 1 ? (100 / pixelRatio) : 100;
var statbrowserUserZoom = 1;
var zoomHideTimer = null;
var zoomPersistTimer = null;

function clampZoom(value) {
	return Math.min(2.0, Math.max(0.5, value));
}

function applyZoom() {
	document.body.style.zoom = (statbrowserBaseZoom * statbrowserUserZoom) + "%";
}

function showZoomIndicator() {
	zoomIndicator.textContent = "Scale: " + Math.round(statbrowserUserZoom * 100) + "%";
	zoomIndicator.style.opacity = "1";
	clearTimeout(zoomHideTimer);
	zoomHideTimer = setTimeout(function() {
		zoomIndicator.style.opacity = "0";
	}, 1200);
}

function scheduleZoomPersist() {
	clearTimeout(zoomPersistTimer);
	zoomPersistTimer = setTimeout(function() {
		byond_topic(
			"?src=_statpanel_;statbrowser_zoom_save=1;zoom_value="
			+ encodeURIComponent(String(statbrowserUserZoom))
		);
	}, 200);
}

function set_zoom_pref(value) {
	var parsed = Number(value);
	if (!isFinite(parsed) || parsed <= 0) return;
	statbrowserUserZoom = clampZoom(parsed);
	applyZoom();
}

function updateZoom(delta) {
	statbrowserUserZoom = clampZoom(Math.round((statbrowserUserZoom + delta) * 100) / 100);
	applyZoom();
	scheduleZoomPersist();
	showZoomIndicator();
}

window.addEventListener("wheel", function(event) {
	if (!event.ctrlKey) return;
	var direction = Math.sign(event.deltaY);
	if (!direction) return;
	event.preventDefault();
	updateZoom(direction < 0 ? 0.1 : -0.1);
}, { passive: false });

applyZoom();

function safeParse(str, fallback) {
	try { return JSON.parse(str); }
	catch (e) { return fallback !== undefined ? fallback : null; }

// DM sends this once per session to assert which payload shape it speaks.
// On mismatch we log a single warning to the console and ask BYOND to reload the cached HTML.
// (The cached HTML is the most common cause of mismatch — WebView2 holds an old build.)
function set_protocol_version(ver_str) {
	var ver = parseInt(ver_str, 10);
	if (!ver) return;
	State.protocolVersion = ver;
	if (ver === EXPECTED_PROTOCOL_VERSION) return;
	if (State.protocolMismatchReported) return;
	State.protocolMismatchReported = true;
	try {
		console.warn("[statbrowser] Protocol mismatch: client expects " + EXPECTED_PROTOCOL_VERSION + ", server speaks " + ver + ". Asking BYOND to reload the panel.");
	} catch (e) {}
	// Best-effort: ask DM to re-browse the file. Hosts that don't expose this href harmlessly drop it.
	byond_topic("?reload_statbrowser=1");
}

function update_mc(server_data_encoded, ss_data_encoded, coords_entry, iteration_str) {
	// DM ships an iteration counter (Master.iteration) so JS can dedupe identical full payloads
	// without JSON.stringify-hashing every update. When iteration is unchanged, DM omits the heavy
	// payload and only ships fresh coords. We update only what changed and skip the redraw call
	// in the coords-only case unless the eye position string actually moved.
	var iter = iteration_str != null && iteration_str !== "" ? parseInt(iteration_str, 10) : NaN;
	var hasFullPayload = !!(server_data_encoded && ss_data_encoded);
	if (hasFullPayload) {
		var serverData = safeParse(server_data_encoded);
		var ssData = safeParse(ss_data_encoded);
		if (!serverData || !ssData) return;
		State.mcServerData = serverData;
		State.mcSSData = ssData;
		// Track iteration if DM provided it; else bump locally so renderer dirty checks still trigger
		// (covers older DM payloads or any path that doesn't include the counter).
		if (!isNaN(iter)) State.mcIteration = iter;
		else State.mcIteration = (State.mcIteration | 0) + 1;
	}
	var prevCoords = State.mcServerData.coords;
	if (coords_entry != null && coords_entry !== "") {
		State.mcServerData.coords = coords_entry;
	}
	addPermanentTab("MC");
	if (_settingsActive || State.currentTab !== "MC") return;
	// Skip the full draw call in the coords-only case unless coords actually changed.
	// All other sections are dirty-checked via mcIteration so they'd be no-ops anyway.
	if (!hasFullPayload && coords_entry === prevCoords) return;
	draw_mc();
}

// Returns true if the user is currently typing into something (we should NOT hijack their key).
function _shortcutInTextInput() {
	var ae = document.activeElement;
	if (!ae) return false;
	var tag = ae.tagName;
	if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return true;
	if (ae.isContentEditable) return true;
	return false;
}

// Tab list excluding chrome (search button, settings gear) — index by visible order.
function _orderedTabButtons() {
	var btns = [];
	var children = tabBar.children;
	for (var i = 0; i < children.length; i++) {
		var c = children[i];
		if (!c.classList || !c.classList.contains("tab-btn")) continue;
		btns.push(c);
	}
	btns.sort(function(a, b) {
		return (parseInt(a.style.order, 10) || 0) - (parseInt(b.style.order, 10) || 0);
	});
	return btns;
}

document.addEventListener("keydown", function(e) {
	if (e.key === "Escape") {
		if (globalSearchOverlay.classList.contains("visible")) {
			closeGlobalSearch();
			e.preventDefault();
			return;
		}
		if (_settingsActive) {
			_settingsActive = false;
			renderCurrentTab();
			e.preventDefault();
			return;
		}
	}
	// "/" or Ctrl+F opens global search — only when not typing into an input.
	if ((e.key === "/" || (e.key.toLowerCase() === "f" && (e.ctrlKey || e.metaKey))) && !_shortcutInTextInput()) {
		e.preventDefault();
		if (!globalSearchOverlay.classList.contains("visible")) openGlobalSearch();
		return;
	}
	// Ctrl+1..9 jumps to the Nth tab in display order.
	if ((e.ctrlKey || e.metaKey) && !e.shiftKey && !e.altKey && /^[1-9]$/.test(e.key) && !_shortcutInTextInput()) {
		var idx = parseInt(e.key, 10) - 1;
		var btns = _orderedTabButtons();
		if (idx < btns.length) {
			e.preventDefault();
			var label = btns[idx].id.replace(/^tab-/, "");
			tab_change(label);
		}

// Ctrl+Click on any link copies its DM ref/href to the clipboard. Useful for admin workflows
// (paste into chat, share with another admin, feed into a SDQL2 query) without round-tripping
// through the BYOND verb panel.
document.addEventListener("click", function(e) {
	if (!(e.ctrlKey || e.metaKey)) return;
	var a = e.target;
	while (a && a !== document.body) {
		if (a.tagName === "A" && a.href) break;
		a = a.parentNode;
	}
	if (!a || !a.href) return;
	// Extract a meaningful identifier — REF or full href
	var match = /\[?(0x[0-9a-fA-F]+)\]?|(\?[^"'\s]+)/.exec(a.href);
	var payload = match ? (match[1] || match[2] || a.href) : a.href;
	try {
		if (navigator.clipboard && navigator.clipboard.writeText) {
			navigator.clipboard.writeText(payload);
		} else {
			// Fallback for environments without async clipboard
			var ta = document.createElement("textarea");
			ta.value = payload;
			document.body.appendChild(ta);
			ta.select();
			try { document.execCommand("copy"); } catch (err) {}
			document.body.removeChild(ta);
		}
		e.preventDefault();
		// Visual flash on the link to confirm the copy
		var prev = a.style.backgroundColor;
		a.style.backgroundColor = "var(--accent, #4a9eff)";
		setTimeout(function() { a.style.backgroundColor = prev; }, 200);
	} catch (err) {}
}, true);

function restoreFocus() {
	var tag = document.activeElement && document.activeElement.tagName;
	if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;
	run_after_focus(function() {
		byond_winset({ "map.focus": "true" });
	});
}

function getCookie(cname) {
	var name = cname + "=";
	var ca = document.cookie.split(";");
	for (var i = 0; i < ca.length; i++) {
		var c = ca[i];
		while (c.charAt(0) === " ") c = c.substring(1);
		if (c.indexOf(name) === 0) return decodeURIComponent(c.substring(name.length, c.length));
	}
	return "";
}
