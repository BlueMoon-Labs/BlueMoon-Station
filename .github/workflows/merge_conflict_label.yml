name: Merge Conflict Label

# Labels open PRs that conflict with master and takes the label off once they do not.
# Uses only the API, no code of the PR runs here.
on:
  push:
    branches:
      - master
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  issues: write
  pull-requests: write

concurrency:
  group: merge-conflict-label
  cancel-in-progress: true

jobs:
  label:
    name: Label conflicting PRs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const LABEL = 'Merge Conflict';
            const { owner, repo } = context.repo;
            const query = `query($owner: String!, $repo: String!, $cursor: String) {
              repository(owner: $owner, name: $repo) {
                pullRequests(states: OPEN, first: 100, after: $cursor) {
                  pageInfo { hasNextPage endCursor }
                  nodes { number mergeable labels(first: 50) { nodes { name } } }
                }
              }
            }`;
            const openPulls = async () => {
              const pulls = [];
              for (let cursor = null; ;) {
                const page = (await github.graphql(query, { owner, repo, cursor })).repository.pullRequests;
                pulls.push(...page.nodes);
                if (!page.pageInfo.hasNextPage) {
                  return pulls;
                }
                cursor = page.pageInfo.endCursor;
              }
            };
            try {
              await github.rest.issues.getLabel({ owner, repo, name: LABEL });
            }
            catch (error) {
              if (error.status !== 404) {
                throw error;
              }
              await github.rest.issues.createLabel({ owner, repo, name: LABEL, color: 'b60205', description: 'Конфликтует с master' });
            }
            // GitHub computes mergeability lazily after a push: UNKNOWN is asked again a few times.
            const done = new Set();
            for (let attempt = 0; attempt < 6; attempt++) {
              const pulls = (await openPulls()).filter((pull) => !done.has(pull.number));
              for (const pull of pulls.filter((candidate) => candidate.mergeable !== 'UNKNOWN')) {
                done.add(pull.number);
                const labeled = pull.labels.nodes.some((label) => label.name === LABEL);
                if (pull.mergeable === 'CONFLICTING' && !labeled) {
                  await github.rest.issues.addLabels({ owner, repo, issue_number: pull.number, labels: [LABEL] });
                  core.info(`#${pull.number}: conflict, labeled`);
                }
                else if (pull.mergeable === 'MERGEABLE' && labeled) {
                  await github.rest.issues.removeLabel({ owner, repo, issue_number: pull.number, name: LABEL });
                  core.info(`#${pull.number}: no conflict any more, label removed`);
                }
              }
              if (pulls.every((pull) => pull.mergeable !== 'UNKNOWN')) {
                return;
              }
              await new Promise((resolve) => setTimeout(resolve, 20000));
            }
            core.info('Some PRs still have unknown mergeability, the next push checks them again.');
