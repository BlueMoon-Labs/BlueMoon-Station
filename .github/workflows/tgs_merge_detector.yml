name: TGS Test Merge Detector

on:
  issue_comment:
    types:
      - created

jobs:
  handle_test_merge:
    # Filtered here, not in a step: other comments do not take a runner at all.
    if: >-
      github.event.issue.pull_request &&
      vars.TARGET_USER != '' &&
      github.event.comment.user.login == vars.TARGET_USER &&
      (contains(github.event.comment.body, 'Test Merge Deployed') || contains(github.event.comment.body, 'Test Merge Removed'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Add or remove the Test Merged label
        uses: actions/github-script@v9
        with:
          script: |
            const issue = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
            };
            if (context.payload.comment.body.includes('Test Merge Deployed')) {
              await github.rest.issues.addLabels({ ...issue, labels: ['Test Merged'] });
              core.info('Label "Test Merged" added.');
              return;
            }
            try {
              await github.rest.issues.removeLabel({ ...issue, name: 'Test Merged' });
              core.info('Label "Test Merged" removed.');
            }
            catch (error) {
              if (error.status !== 404) {
                throw error;
              }
              core.info('The pull request had no "Test Merged" label.');
            }
