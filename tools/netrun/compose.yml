# Запускается docker-lifecycle.mjs; source digest и token file задаются явно, секрет не попадает в image.
services:
  byond:
    image: ${NETRUN_STATION_IMAGE:?Build the reviewed station image first}
    pull_policy: never
    platform: linux/amd64
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "16m"
        max-file: "5"
    ports:
      - "${NETRUN_GAME_ADDRESS:-127.0.0.1}:${NETRUN_GAME_PORT:-1337}:1337"
    environment:
      NETRUN_CORE_MODE: external
      NETRUN_CORE_PORT: "18462"
      NETRUN_CORE_LIBRARY: /tgstation/libnetrun_bridge.so
      NETRUN_CORE_TOKEN_FILE: /run/secrets/netrun_session_token
    volumes:
      - type: bind
        source: ${NETRUN_CONFIG_DIRECTORY:?Set an existing reviewed station config directory}
        # BYOND x86 не читает Windows bind mounts с 64-bit inode: entrypoint создаёт native copy.
        target: /run/netrun/config-source
        read_only: true
      - netrun-station-data:/tgstation/data
    secrets:
      - netrun_session_token
    healthcheck:
      # Пассивная проверка game listener без пустых клиентских подключений к DreamDaemon.
      test: ["CMD", "/bin/bash", "-c", "grep -q ':0539 .* 0A ' /proc/net/tcp"]
      interval: 5s
      timeout: 2s
      retries: 12
      start_period: 180s

  netrun-host:
    image: ${NETRUN_HOST_IMAGE:?Build the matching reviewed Host image first}
    pull_policy: never
    platform: linux/amd64
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "16m"
        max-file: "5"
    network_mode: service:byond
    depends_on:
      byond:
        condition: service_started
    # Совпадает с владельцем/группой generated secret; effective UID всегда non-root.
    user: "${NETRUN_HOST_UID:-1654}:${NETRUN_HOST_GID:-1654}"
    environment:
      NETRUN_SESSION_TOKEN_FILE: /run/secrets/netrun_session_token
      NETRUN_PORT: "18462"
      NETRUN_LOG_LEVEL: ${NETRUN_LOG_LEVEL:-info}
      NETRUN_LOG_TELEMETRY_INTERVAL_MS: ${NETRUN_LOG_TELEMETRY_INTERVAL_MS:-2000}
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 10s
    secrets:
      - netrun_session_token
    healthcheck:
      # Host обслуживает один мир последовательно: TCP probe заполнил бы backlog активной сессии.
      test: ["CMD", "/bin/bash", "-c", "grep -q '0100007F:481E .* 0A ' /proc/net/tcp"]
      interval: 5s
      timeout: 2s
      retries: 6
      start_period: 10s

secrets:
  netrun_session_token:
    file: ${NETRUN_CORE_TOKEN_FILE:?Set the external or ignored token file path}

volumes:
  netrun-station-data:
