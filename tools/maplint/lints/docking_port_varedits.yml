help: "Custom mobile docking_port sizes detected. Shuttle templates size their mobile port automatically, these should not be varedits."
/obj/docking_port/mobile:
  banned_variables:
    - width
    - height
    - dwidth
    - dheight
  skip_files:
    # Ruins and stations are not loaded as shuttle templates, their mobile ports keep the varedited size
    - pattern: "^_maps/(?!shuttles/)"
